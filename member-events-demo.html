<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf9f7" />
  <title>Privé Network</title>
  <link rel="icon" href="assets/prive-logo.svg" />

  <!-- Privé type system (theprive.network): Mencken Std (serif headings), Mencken Std Head Italic (accents), Inter (body/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind v4 in the browser, so the app's utility classes can be reused as-is -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>

  <style type="text/tailwindcss">
    /* Mencken Std, as served by theprive.network (local copy first, then the live site, which allows cross-origin use) */
    @font-face { font-family: "Mencken"; font-weight: 400; font-style: normal; font-display: swap;
      src: url("assets/fonts/MenckenStd-Regular.woff2") format("woff2"),
           url("https://www.theprive.network/_next/static/immutable/media/MenckenStd_Regular-s.p.22vywu8qwyqcr.woff2") format("woff2"); }
    @font-face { font-family: "Mencken"; font-weight: 700; font-style: normal; font-display: swap;
      src: url("assets/fonts/MenckenStd-Bold.woff2") format("woff2"),
           url("https://www.theprive.network/_next/static/immutable/media/MenckenStd_Bold-s.p.2px84nkrnz4zu.woff2") format("woff2"); }
    @font-face { font-family: "Mencken Head"; font-weight: 400; font-style: italic; font-display: swap;
      src: url("assets/fonts/MenckenStdHead-Italic.woff2") format("woff2"),
           url("https://www.theprive.network/_next/static/immutable/media/MenckenStdHead_Italic-s.p.3z_0n971t9glb.woff2") format("woff2"); }
    @theme inline {
      --font-heading: "Mencken", "Mencken Std", Georgia, "Times New Roman", serif;

      /* Executive Command Centre (#/dashboard): colour names for Tailwind (bg-ex-surface, text-ex-good-ink, ...).
         Values are set on .exec-dashboard only, so these resolve nowhere else on the page. */
      --color-ex-canvas: var(--ex-canvas);
      --color-ex-surface: var(--ex-surface);
      --color-ex-subtle: var(--ex-subtle);
      --color-ex-border: var(--ex-border);
      --color-ex-text: var(--ex-text);
      --color-ex-text-2: var(--ex-text-2);
      --color-ex-text-3: var(--ex-text-3);
      --color-ex-primary: var(--ex-primary);
      --color-ex-on-primary: var(--ex-on-primary);
      --color-ex-on-ai: var(--ex-on-ai);
      --color-ex-on-ai-2: var(--ex-on-ai-2);
      --color-ex-gold: var(--ex-gold);
      --color-ex-gold-ink: var(--ex-gold-ink);
      --color-ex-good: var(--ex-good);
      --color-ex-good-soft: var(--ex-good-soft);
      --color-ex-good-ink: var(--ex-good-ink);
      --color-ex-watch: var(--ex-watch);
      --color-ex-watch-soft: var(--ex-watch-soft);
      --color-ex-watch-ink: var(--ex-watch-ink);
      --color-ex-bad: var(--ex-bad);
      --color-ex-bad-soft: var(--ex-bad-soft);
      --color-ex-bad-ink: var(--ex-bad-ink);
      --color-ex-neutral: var(--ex-neutral);
      --color-ex-neutral-ink: var(--ex-neutral-ink);
      --color-ex-growth: var(--ex-growth);
      --color-ex-technology: var(--ex-technology);
      --shadow-ex: var(--ex-shadow);
    }
    /* Privé tokens (from theprive.network :root) */
    :root {
      --pv-serif: "Mencken", "Mencken Std", Georgia, "Times New Roman", serif;
      --pv-head: "Mencken Head", "Mencken Std Head", Georgia, serif;
      --pv-sans: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --pv-ink: #2c2e29;        /* primary text */
      --pv-ink-2: #1c1917;      /* calendar numerals, strongest text */
      --pv-muted: #6f6a5f;      /* secondary text */
      --pv-muted-2: #9a958c;    /* tiny notes, placeholders */
      --pv-gold: #c9a14a;       /* rules, focus ring, outlines */
      --pv-gold-soft: #c9a46a;  /* pill borders */
      --pv-gold-deep: #b08a3e;  /* hover text, kickers */
      --pv-bronze: #7b5e3b;     /* primary action, icons */
      --pv-bronze-ink: #775e36; /* text on light bronze */
      --pv-bronze-dark: #5e4629;
      --pv-burgundy: #6b2b2b;   /* calendar accents */
      --pv-maroon: #8a1c1c;     /* "upcoming" stamp, badge text */
      --pv-blush: #f1dfd9;      /* calendar cell borders */
      --pv-paper: #fbf9f7;      /* page */
      --pv-cream: #fdfaf6;
      --pv-sand: #f4f1ee;       /* calendar section */
      --pv-linen: #faf8f6;      /* alt sections */
      --pv-taupe: #eae5e1;      /* empty cells */
      --pv-line: #ece4dc;       /* hairlines */
      --pv-line-2: #e8e5e1;
    }
    body {
      background: var(--pv-paper);
      color: var(--pv-ink);
      font-family: var(--pv-sans);
      -webkit-font-smoothing: antialiased;
    }
    *::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }

    /* Tabs, copied from globals.css */
    .action-tabs::before {
      position: absolute; content: ""; bottom: 0; width: 100%; height: 1px; background-color: #ECE4DC;
    }
    .tab-item.bordered::before {
      position: absolute; content: ""; bottom: -1px; left: 0; width: 100%; height: 3px; background-color: #C9A14A;
    }

    /* Placeholder YPO wordmark: replace with <img src="ypo-logo.svg"> once the real logo file is added */
    /* Monochrome to match the Folio look (black mark, like Folio's black dot) */
    /* Member company mark: bronze-to-gold plate with a serif monogram (Privé palette) */
    .ypo-logo {
      flex-shrink: 0; display: inline-grid; place-items: center;
      height: 28px; padding: 0 9px; border-radius: 6px;
      background: linear-gradient(135deg, #8a6a3a 0%, #b08a3e 55%, #c9a14a 100%); color: #fff;
      font: 700 12.5px/1 "Mencken", Georgia, serif; letter-spacing: 1.4px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .ypo-logo::before { content: "YPO"; }
    /* The app is FDC Limited's view: body carries brand-fdc on every page, so the mark reads FDC everywhere */
    body.brand-fdc .ypo-logo::before { content: "FDC"; }
    /* FDC Limited name and FDC mark use the dashboard heading font (Mencken Std, Georgia if it isn't available) */
    body.brand-fdc [data-brand-name], body.brand-fdc .ypo-logo { font-family: var(--pv-serif); }
  </style>

  <!-- ================= FOLIO LOOK =================
       Event details, Who's in the room and their popups use the same design language as Smart Notes (Folio),
       so moving between them feels like one product: zinc greys, system font, black primary buttons,
       10-14px corners, hairline borders, small grey tags. Values are copied from notes_6 (1).html. -->
  <style>
    .fo{
      /* Privé palette: warm paper, ink #2c2e29, hairline #ece4dc, bronze actions, gold rules */
      --bg:#ffffff; --side:#faf8f6; --border:#ece4dc; --fg:#2c2e29; --muted:#6f6a5f; --muted2:#9a958c;
      --hover:#f5f0ec; --active:#efe7df; --shadow:0 30px 80px rgba(0,0,0,.18); --ease:cubic-bezier(.22,1,.36,1);
      --accent:#7b5e3b; --accent-ink:#fff; --gold:#c9a14a;
      font-family:var(--pv-sans);
      color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased;
    }
    /* zero-specificity reset, so component classes (.fo-b, .fo-chip, ...) always win */
    :where(.fo) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    .fo svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .fo ::selection{background:#f1dfd9}

    /* page shell: slim top bar + scrolling centred column */
    .fo-page{flex:1;min-height:0;display:flex;flex-direction:column}
    .fo-top{height:52px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;position:relative;z-index:5}
    .fo-tb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;flex:none}
    .fo-tb:hover,.fo-tb.on{background:var(--hover);color:var(--fg)}
    .fo-crumbs{min-width:0;font-size:13px;color:var(--muted2);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fo-crumbs a{transition:color .15s}.fo-crumbs a:hover{color:var(--fg)}
    .fo-crumbs b{color:var(--muted);font-weight:500}
    .fo-crumbs i{font-style:normal;margin:0 6px;color:var(--border)}
    .fo-spacer{flex:1}
    .fo-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
    .fo-in{max-width:760px;margin:0 auto;padding:24px 36px 96px;animation:foIn .45s var(--ease)}
    .fo-in.wide{max-width:900px}
    @media (max-width:640px){.fo-in{padding:16px 16px 96px}}
    @keyframes foIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* headings + text */
    .fo-hd{display:flex;align-items:flex-start;gap:16px}
    .fo-hd>div{flex:1;min-width:0}
    .fo-h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
    @media (min-width:1024px){.fo-h1.xl{font-size:34px}}
    .fo-sub{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.55}
    .fo-p{font-size:15px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}
    .fo-sec{margin-top:30px}
    .fo-sec>h2{font-size:13px;font-weight:650;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
    .fo-sec>h2 span{font-weight:600;color:var(--muted2);font-variant-numeric:tabular-nums}

    /* tags (Folio's .ev-tag) */
    .fo-tag{font-style:normal;flex:none;font-size:12px;font-weight:650;padding:0 9px;line-height:24px;border-radius:8px;background:var(--hover);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
    .fo-tag.now{background:color-mix(in srgb,#16a34a 14%,transparent);color:#16a34a}
    .fo-tag.now::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:foPulse 1.6s ease-in-out infinite}
    .fo-tag.on{background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--fg)}
    @keyframes foPulse{50%{opacity:.35}}

    /* cards + field rows (Folio's .hc-card / .hc-f) */
    .fo-card{border:1px solid var(--border);border-radius:14px;background:var(--bg);overflow:hidden}
    .fo-f{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border);font-size:14px;min-width:0}
    .fo-f:last-child{border-bottom:0}
    .fo-f .l{width:92px;flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
    .fo-f .v{flex:1;min-width:0;overflow-wrap:anywhere}
    @media (max-width:640px){.fo-f .l{width:auto}.fo-f .l span{display:none}}

    /* buttons (Folio's .md-b / .subbtn) */
    .fo-b{height:40px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:600;border:1px solid var(--border)!important;background:var(--bg)!important;color:var(--fg)!important;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,opacity .15s,transform .15s}
    .fo-b:hover{background:var(--hover)!important}
    .fo-b:active{transform:scale(.97)}
    .fo-b:focus-visible,.fo-tb:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
    .fo-b.pri{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
    .fo-b.pri:hover{opacity:.9}
    .fo-b.sm{height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;gap:6px}
    .fo-b.sm svg.i{width:14px;height:14px}
    @media (max-width:639px){.fo-hide-sm{display:none!important}}
    .fo-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
    @media (max-width:640px){.fo-acts .fo-b{flex:1}}

    /* input */
    .fo-search{position:relative;flex:1;max-width:340px;min-width:0}
    .fo-search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}
    .fo-inp{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 12px 0 36px;font:inherit;font-size:14px;outline:none;transition:border-color .15s}
    .fo-inp:focus{border-color:var(--muted2)}
    .fo-inp::placeholder{color:var(--muted2)}
    @media (max-width:640px){.fo-inp{font-size:16px}}

    /* switch row (Folio's .hc-tg) */
    .fo-tg{display:flex;align-items:flex-start;gap:14px;padding:15px 18px;cursor:pointer}
    .fo-tg .tx{flex:1;min-width:0}
    .fo-tg b{display:block;font-size:13.5px;font-weight:600}
    .fo-tg small{display:block;font-size:12px;color:var(--muted2);line-height:1.5;margin-top:3px}
    .fo-tg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
    .fo-sw{flex:none;width:40px;height:24px;border-radius:12px;background:var(--active);position:relative;margin-top:1px;transition:background .2s;box-shadow:inset 0 0 0 1px var(--border)}
    .fo-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
    .fo-tg input:checked+.fo-sw{background:var(--fg);box-shadow:none}
    .fo-tg input:checked+.fo-sw::after{transform:translateX(16px)}
    .fo-tg input:focus-visible+.fo-sw{outline:2px solid var(--fg);outline-offset:2px}

    /* dropdown menu */
    .fo-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:200px;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:5px}
    .fo-menu button{width:100%;text-align:left;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;transition:background .15s}
    .fo-menu button:hover{background:var(--hover)}
    .fo-menu .danger{color:#dc2626}
    .fo-menu .danger:hover{background:color-mix(in srgb,#dc2626 8%,transparent)}

    /* cover + small thumbs */
    .fo-cover{position:relative;width:100%;aspect-ratio:16/7;max-height:320px;border-radius:14px;overflow:hidden;background:var(--hover);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 6%,transparent)}
    .fo-cover img,.fo-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .fo-th{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--hover)}

    /* people list rows (Folio's sidebar .row / .hc-row) */
    .fo-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
    .fo-row:last-child{border-bottom:0}
    .fo-row:hover{background:var(--side)}
    .fo-row .nm{font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fo-row .ds{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .fo-row .ab{font-size:12.5px;line-height:1.55;color:var(--muted2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fo-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
    .fo-meta span{display:inline-flex;align-items:center;gap:6px;min-width:0}
    .fo-meta svg.i{width:14px;height:14px;color:var(--muted2)}
    .fo-empty{padding:56px 16px;text-align:center}
    .fo-empty b{display:block;font-size:15px;font-weight:650}
    .fo-empty p{font-size:13px;color:var(--muted);margin-top:4px}

    /* popups (Folio's #modal) */
    .fo-scrim{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.32);animation:foFade .2s}
    .fo-modal{position:relative;width:min(540px,100%);max-height:min(88vh,800px);overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation:foPop .28s var(--ease)}
    .fo-modal.sm{width:min(460px,100%)}
    .fo-md-h{display:flex;align-items:center;gap:12px}
    .fo-md-t{flex:1;min-width:0;font-size:17px;font-weight:650;letter-spacing:-.015em}
    .fo-md-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none;align-self:flex-start}
    .fo-md-x:hover{background:var(--hover);color:var(--fg)}
    .fo-md-l{font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:6px}
    .fo-md-p{font-size:14px;line-height:1.6;color:var(--fg);white-space:pre-line}
    .fo-box{border-radius:12px;background:var(--hover);padding:14px 16px}
    .fo-num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;font-weight:650;display:grid;place-items:center;margin-top:1px}
    @keyframes foFade{from{opacity:0}}
    @keyframes foPop{from{opacity:0;transform:translateY(6px) scale(.98)}}

    /* small tag variant + tag sitting on a photo */
    .fo-tag.sm{font-size:11px;line-height:19px;padding:0 7px;border-radius:6px}
    .fo-tag.img{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:var(--fg);backdrop-filter:blur(6px)}
    .fo-tag.img.now{background:rgba(255,255,255,.92);color:#16a34a}

    /* ---------- dashboard ---------- */
    .fo-panel{border:1px solid var(--border);border-radius:16px;background:var(--side);padding:20px;display:flex;flex-direction:column;min-height:0}
    .fo-panel-h{display:flex;align-items:center;gap:10px;flex:none;margin-bottom:16px}
    .fo-panel-h h2{font-size:17px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
    .fo-panel-h h2 svg.i{width:18px;height:18px;color:var(--muted)}
    .fo-panel-h small{font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
    .fo-ev{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .2s,transform .2s var(--ease),border-color .2s}
    .fo-ev:hover{box-shadow:0 6px 22px rgba(0,0,0,.08);border-color:#d4d4d8;transform:translateY(-1px)}
    .fo-ev.off{cursor:default}.fo-ev.off:hover{box-shadow:none;transform:none;border-color:var(--border)}
    .fo-ev-img{position:relative;height:150px;background:var(--hover);overflow:hidden}
    .fo-ev-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s var(--ease)}
    .fo-ev:hover .fo-ev-img img{transform:scale(1.04)}
    .fo-ev-img img.gray{filter:grayscale(35%)}
    .fo-ev-b{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px 16px 14px}
    .fo-ev-d{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
    .fo-ev-t{font-size:15.5px;font-weight:650;letter-spacing:-.015em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .fo-ev-f{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--fg);min-height:43px}
    .fo-ev-f .go{display:inline-flex;align-items:center;gap:7px}
    .fo-ev-f .arr{color:var(--muted2);transition:transform .2s var(--ease),color .2s}
    .fo-ev:hover .fo-ev-f .arr{transform:translateX(3px);color:var(--fg)}
    /* Live & Upcoming: Upcoming row over Completed row, each scrolling sideways with two cards in view */
    /* Events page canvas: soft indigo wash with a faint blue-violet-rose glow at the top (same family as the
       Collective intelligence AI wash), so the gutters between cards read as deliberate, not as empty white */
    #shell.ev-canvas{background:
      radial-gradient(1000px 520px at 6% -140px, rgba(201,161,74,.07), transparent 65%),
      radial-gradient(820px 460px at 94% -100px, rgba(241,223,217,.45), transparent 65%),
      linear-gradient(180deg,#fdfcfa 0%,#f9f6f2 480px,#f9f6f2 100%)}
    /* the base .fo style paints white; let the canvas show through the layout wrappers */
    .ev-canvas #app > .fo{background:transparent}
    .ev-canvas #subBar.fo{background:transparent;border-bottom-color:#ece4dc}
    .ev-canvas #topNav{position:relative;z-index:55}
    .ev-canvas .fo-panel{background:#fff;border-color:#efe5dc;border-radius:18px;
      box-shadow:0 1px 2px rgba(28,25,23,.04),0 18px 40px -24px rgba(28,25,23,.22)}
    .ev-canvas .exec-dashboard.ex-embed .ex-card{border-color:#efe5dc;border-radius:18px;
      box-shadow:0 1px 2px rgba(28,25,23,.04),0 18px 40px -24px rgba(28,25,23,.22)}
    .fo-strip+.fo-strip{margin-top:24px}

    /*
     * ---------- Executive Command Centre (#/dashboard) ----------
     * Theme scoped to .exec-dashboard so no other page changes. The render functions never use raw colours:
     * they use these tokens through Tailwind (bg-ex-surface, text-ex-text, ...), mapped in the @theme block above.
     *
     * Deviations from the brief, for WCAG AA:
     *  - text-tertiary is #67718A; the briefed #8C96AE is below 4.5:1 on cards.
     *  - *-ink tokens (and gold-ink) are darker status colours for small text on soft status backgrounds.
     * White theme only (client request): no dark mode, no theme toggle.
     */
    .exec-dashboard {
      /* Privé palette (theprive.network). Text tokens keep WCAG AA on white and on the paper canvas. */
      --ex-canvas: #F9F6F2;
      --ex-surface: #FFFFFF;
      --ex-subtle: #FAF8F6;
      --ex-border: #ECE4DC;
      --ex-text: #2C2E29;
      --ex-text-2: #6F6A5F;
      --ex-text-3: #77716C;
      --ex-primary: #7B5E3B;
      --ex-on-primary: #FFFFFF;
      --ex-ai-from: #2A2118;
      --ex-ai-to: #15110D;
      --ex-on-ai: #FBF3E2;
      --ex-on-ai-2: #D9C29A;
      --ex-gold: #C9A14A;
      --ex-gold-ink: #775E36;

      --ex-good: #4F8A5B;  --ex-good-soft: #EAF1E8;  --ex-good-ink: #3F6B45;
      --ex-watch: #C9A14A; --ex-watch-soft: #FBF1DE; --ex-watch-ink: #8A5A12;
      --ex-bad: #8A1C1C;   --ex-bad-soft: #F6E6E3;   --ex-bad-ink: #6B2B2B;
      --ex-neutral: #B5ADA4; --ex-neutral-ink: #6F6A5F;

      --ex-growth: #B08A3E;
      --ex-technology: #6B2B2B;

      --ex-shadow: 0 1px 2px rgba(28, 25, 23, .04), 0 18px 40px -24px rgba(28, 25, 23, .22);

      color-scheme: light;
      /* Privé "intro" section: warm paper fading down to linen */
      background: linear-gradient(180deg, #FDFCFA 0%, var(--ex-canvas) 360px) var(--ex-canvas);
      color: var(--ex-text);
      font-family: var(--pv-sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    .exec-dashboard .ex-num { font-variant-numeric: tabular-nums; }
    /* Section headings (Collective intelligence, Events): one shared style in Mencken Std.
       Mencken Std is loaded from assets/fonts (Privé's own files), otherwise Georgia. */
    /* Collective intelligence card headline: large serif */
    .exec-dashboard .ex-insight { font-family: var(--pv-serif); font-size: 19px; line-height: 26px; font-weight: 400; letter-spacing: -0.01em; color: var(--ex-text); }
    /* NEW Collective intelligence UI: larger hero headline, faint AI wash behind the header, bar/ring/detail motion */
    .exec-dashboard .ex-insight-hero { font-size: 24px; line-height: 31px; }
    .exec-dashboard .ex-ci-wash { background: linear-gradient(115deg, rgba(201,161,74,.10) 0%, rgba(241,223,217,.45) 55%, rgba(250,248,246,.6) 100%); }
    .exec-dashboard .ex-ci-hero { background: radial-gradient(120% 140% at 0% 0%, rgba(201,161,74,.08), transparent 60%); }
    @media (prefers-reduced-motion: no-preference) {
      .exec-dashboard .ex-bar-grow { transform-origin: left; animation: exBar .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms + 250ms); }
      @keyframes exBar { from { transform: scaleX(0); } }
      .exec-dashboard .ex-ring-grow { animation: exRing 1.1s cubic-bezier(.2, .8, .2, 1) .15s both; }
      @keyframes exRing { from { stroke-dashoffset: var(--c); } }
      .exec-dashboard .ex-ci-detail { animation: exRise .25s cubic-bezier(.2, .8, .2, 1) both; }
    }
    .exec-dashboard .ex-heading { font-family: var(--pv-serif); font-size: 24px; line-height: 30px; font-weight: 400; letter-spacing: -0.01em; color: var(--ex-text); }
    /* Dashboard canvas runs edge to edge and fills the full height of the page area (no white strip below or beside it);
       the dashboard's own inner container keeps the side padding */
    #app:has(> .exec-dashboard:not(.ex-embed)) { margin-left: 0; margin-right: 0; }
    #app > .exec-dashboard:not(.ex-embed) { flex: 1 0 auto; }
    /* Collective intelligence card embedded on Live & Upcoming: keep the page's own background */
    .exec-dashboard.ex-embed { background: none; flex: none; }

    /* AI brief panel: white card */
    .exec-dashboard .ex-ai-panel { background: var(--ex-surface); border: 1px solid var(--ex-border); box-shadow: var(--ex-shadow); }

    /* 2px primary focus ring everywhere */
    .exec-dashboard :focus-visible { outline: 2px solid var(--ex-gold); outline-offset: 2px; border-radius: 10px; }

    .exec-dashboard .ex-scroll { scrollbar-width: thin; }
    .exec-dashboard .ex-scroll::-webkit-scrollbar { display: block; height: 6px; }
    .exec-dashboard .ex-scroll::-webkit-scrollbar-thumb { background: var(--ex-border); border-radius: 3px; }

    /* recharts draws its own focus outline on the svg */
    .exec-dashboard .recharts-wrapper:focus, .exec-dashboard .recharts-surface:focus { outline: none; }

    /* one load animation: main rows fade up, staggered */
    @media (prefers-reduced-motion: no-preference) {
      .exec-dashboard .ex-rise { animation: exRise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
      @keyframes exRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      /* event sheet: slides in from the right, backdrop fades */
      .exec-dashboard .ex-sheet-in { animation: exSheet .32s cubic-bezier(.2, .8, .2, 1) both; }
      .exec-dashboard .ex-fade-in { animation: exFade .25s ease both; }
      @keyframes exSheet { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes exFade { from { opacity: 0; } }
      /* Events pill: the down chevron gently bobs to say "more below" */
      .exec-dashboard .ex-ev-bob { animation: exBob 1.6s ease-in-out infinite; }
      @keyframes exBob { 0%, 100% { transform: none; } 50% { transform: translateY(3px); } }
    }
    /* scrolls, but no visible scrollbar */
    .exec-dashboard .ex-noscroll { scrollbar-width: none; }
    .exec-dashboard .ex-noscroll::-webkit-scrollbar { display: none; }
    .exec-dashboard .ex-sheet-body { scrollbar-width: thin; scrollbar-color: var(--ex-border) transparent; }

    .exec-dashboard .ex-print-only { display: none; }

    @media print {
      body:has(.exec-dashboard) #topNav, body:has(.exec-dashboard) #subBar { display: none !important; }
      body:has(.exec-dashboard) .h-dvh, body:has(.exec-dashboard) #app { height: auto !important; overflow: visible !important; }
      .exec-dashboard .ex-print-only { display: inline; }
      .exec-dashboard { background: var(--ex-surface) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .exec-dashboard .ex-no-print { display: none !important; }
      .exec-dashboard .ex-card, .exec-dashboard .ex-ai-panel { break-inside: avoid; box-shadow: none !important; }
      .exec-dashboard .ex-rise { animation: none !important; }
    }

    .fo-ob{--ob-ink:#2C2E29;--ob-pri:#7B5E3B;--ob-pri-soft:#F5EEE4;--ob-ring:rgba(201,161,74,.22);--ob-line:#ECE4DC;background:#FBF9F7}
    .fo-ob .fo-side{width:290px;padding:28px 14px 22px;background:linear-gradient(180deg,#fcfbf9,#f8f5f2);border-right:1px solid #ECE4DC;flex-direction:column}
    @media (min-width:1024px){.fo-ob .fo-side{display:flex}}
    .fo-ob .fo-side .brand{font-size:15px;padding:0 12px;color:var(--ob-ink)}
    .fo-ob .fo-side .brand .dot{background:var(--ob-pri)}
    .fo-ob .fo-side .intro{padding:6px 12px 0;color:#6F6A5F}
    .fo-ob .fo-lbl{padding:22px 12px 8px;color:#9A958C}
    .fo-ob .fo-step{position:relative;padding:10px 12px;border-radius:10px;margin-bottom:2px}
    .fo-ob .fo-step:hover{background:rgba(123,94,59,.06)}
    .fo-ob .fo-step.on{background:#fff;box-shadow:0 1px 2px rgba(28,25,23,.06),inset 0 0 0 1px #ECE4DC}
    .fo-ob .fo-step.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:#C9A14A}
    .fo-ob .fo-step .n{width:24px;height:24px;font-size:11.5px;background:#fff;border-color:#E2D6C8}
    .fo-ob .fo-step.on .n{background:var(--ob-pri);border-color:var(--ob-pri);color:#fff}
    .fo-ob .fo-step .n.ok{background:#4F8A5B;border-color:#4F8A5B;color:#fff}
    .fo-ob .ob-why{margin-top:auto;border:1px solid #ECE4DC;border-radius:12px;padding:14px;background:#fff}
    .fo-ob .ob-why b{display:block;font-size:13px;font-weight:600;color:var(--ob-ink)}
    .fo-ob .ob-why .m{height:6px;border-radius:6px;background:#F1EAE2;overflow:hidden;margin:10px 0 6px}
    .fo-ob .ob-why .m span{display:block;height:100%;border-radius:6px;background:#C9A14A}
    .fo-ob .ob-why small{font-size:12px;color:#6F6A5F;font-variant-numeric:tabular-nums}
    .fo-ob .fo-in{max-width:840px;padding:28px 36px 96px}
    @media (max-width:640px){.fo-ob .fo-in{padding:16px 14px 96px}}
    .fo-ob .ob-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:12.5px;font-weight:600;color:var(--ob-pri)}
    .fo-ob .ob-bar{flex:1;height:6px;border-radius:6px;background:#F1EAE2;overflow:hidden}
    .fo-ob .ob-bar span{display:block;height:100%;border-radius:6px;background:var(--ob-pri);transition:width .4s var(--ease)}
    .fo-ob .ob-card{background:#fff;border:1px solid var(--ob-line);border-radius:16px;padding:28px;box-shadow:0 1px 2px rgba(28,25,23,.04),0 18px 40px -24px rgba(28,25,23,.18)}
    @media (max-width:640px){.fo-ob .ob-card{padding:18px;border-radius:14px}}
    .fo-ob .ob-ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
    .fo-ob .ob-ico.s0{background:#F5EEE4;color:#7B5E3B}
    .fo-ob .ob-ico.s1{background:#F6E6E3;color:#6B2B2B}
    .fo-ob .ob-ico.s2{background:#FBF1DE;color:#8A5A12}
    .fo-ob .ob-ico.s3{background:#EAF1E8;color:#3F6B45}
    .fo-ob .fo-hd{align-items:center}
    .fo-ob .fo-h1{font-size:24px;color:var(--ob-ink)}
    .fo-ob .fo-sub{margin-top:4px}
    .fo-ob .fo-hr{background:#ECE4DC;margin:22px 0}
    .fo-ob .fo-label{color:#2C2E29}
    .fo-ob .fo-field{height:42px;border-radius:10px;border-color:#ECE4DC;transition:border-color .15s,box-shadow .15s}
    .fo-ob .fo-field:hover{border-color:#D9C6A8}
    .fo-ob .fo-field:focus{border-color:var(--ob-pri);box-shadow:0 0 0 3px var(--ob-ring)}
    .fo-ob .fo-field.area{height:auto}
    .fo-ob .fo-field.border-\[\#DC2626\]{border-color:#dc2626}
    .fo-ob .fo-chip{height:34px;padding:0 14px}
    .fo-ob .fo-chip:hover{border-color:#D9C6A8!important}
    .fo-ob .fo-chip.on{background:var(--ob-pri-soft)!important;border-color:#C9A46A!important;color:var(--ob-pri)!important}
    .fo-ob .fo-num{background:var(--ob-pri-soft);color:var(--ob-pri)}
    .fo-ob .fo-ck.on{background:var(--ob-pri);border-color:var(--ob-pri)}
    .fo-ob .fo-seg{background:#F5EEE4}
    .fo-ob .fo-seg button.on{color:var(--ob-pri)}
    .fo-ob .fo-card{border-color:var(--ob-line);border-radius:12px}
    .fo-ob .fo-b{height:42px;border-radius:10px}
    .fo-ob .fo-b.sm{height:32px;border-radius:999px}
    .fo-ob .fo-b.pri{background:var(--ob-pri)!important;border-color:var(--ob-pri)!important;color:#fff!important;padding:0 18px}
    .fo-ob .fo-b.pri:hover{background:#5E4629!important;opacity:1}
    .fo-ob .fo-foot{border-top:1px solid #ECE4DC;padding-top:20px;margin-top:4px}


    /* ---------- hamburger bar + drawer menu (shared chrome) ---------- */
    #subBar.fo{height:48px;border-bottom:1px solid var(--border)}
    .fo-nav-row{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;font-size:13.5px;color:var(--muted);transition:background .15s,color .15s;width:100%;text-align:left}
    .fo-nav-row:hover{background:var(--hover);color:var(--fg)}
    .fo-nav-row.on{background:var(--active);color:var(--fg);font-weight:550}
    .fo-nav-row svg{width:16px;height:16px;flex:none}
    .fo-nav-row .c{margin-left:auto;font-size:11.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
    .fo-nav-row.danger{color:#dc2626}
    .fo-nav-row.danger:hover{background:color-mix(in srgb,#dc2626 8%,transparent);color:#dc2626}

    /* ---------- top navbar (Folio look) ---------- */
    #topNav{height:56px;border-bottom:1px solid var(--border)}
    .fo-brand{display:flex;align-items:center;gap:10px;min-width:0;height:40px;padding:0 8px 0 4px;border-radius:10px;transition:background .15s}
    .fo-brand:hover{background:var(--hover)}
    .fo-brand .nm{font-size:15px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fo-dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2px var(--bg)}
    .fo-me-btn{height:40px;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;border-radius:10px;transition:background .15s}
    .fo-me-btn:hover,.fo-me-btn.on{background:var(--hover)}
    .fo-me-btn img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--hover)}
    .fo-me-btn .nm{font-size:13.5px;font-weight:600}
    .fo-me-btn .chev{display:grid;color:var(--muted2);transition:transform .25s}
    .fo-me-btn.on .chev{transform:rotate(180deg)}
    .fo-me{width:280px;top:calc(100% + 8px);z-index:50;padding:5px;animation:foPop .2s var(--ease)}

    /* dashed "+" chip (Register: Spouse / Children / Guests) */
    .fo-chip.dashed{border-style:dashed!important}
    .fo-chip svg.i{width:14px;height:14px}

    /* loader + toast */
    .fo-spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--fg);animation:foSpin .8s linear infinite}
    @keyframes foSpin{to{transform:rotate(360deg)}}
    .fo-toast{position:fixed;left:50%;bottom:26px;z-index:120;max-width:calc(100vw - 32px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
      background:#2c2e29;color:#fbf3e2;padding:11px 18px;border-radius:999px;font:500 13px/1.4 "Inter",system-ui,sans-serif;border:1px solid rgba(201,161,74,.45);
      box-shadow:0 8px 30px rgba(0,0,0,.14);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
    .fo-toast.show{transform:translate(-50%,0);opacity:1}

    /* =====================================================================================================
       PRIVÉ DESIGN LAYER — design language taken from theprive.network
       Type:   Mencken Std (serif, weight 400) for titles · Mencken Std Head Italic for accents · Inter for UI/body
       Colour: paper #fbf9f7 · ink #2c2e29 · muted #6f6a5f · hairline #ece4dc · gold #c9a14a (rules, focus)
               bronze #7b5e3b (primary actions) · burgundy #6b2b2b / maroon #8a1c1c (dates, "upcoming")
       Shape:  pill buttons with 1.5px gold outline · 10–18px cards · 24px popups · 3px gold rule under titles
       Motion: cubic-bezier(.22,1,.36,1), soft lift on hover
       ===================================================================================================== */

    /* ---- Typography: serif titles, gold rule under page titles ---- */
    .fo-h1{font-family:var(--pv-serif);font-weight:400;letter-spacing:.005em;line-height:1.15;color:var(--pv-ink)}
    .fo-h1::after{content:"";display:block;width:clamp(48px,4.4vw,64px);height:3px;border-radius:2px;background:var(--pv-gold);margin-top:.35em}
    .fo-hd .fo-h1::after{margin-top:.3em}
    @media (min-width:1024px){.fo-h1.xl{font-size:40px}}
    .fo-sub{color:var(--pv-muted)}
    .fo-p{color:var(--pv-muted);line-height:1.6}
    .fo-sec>h2{font-family:var(--pv-serif);font-size:19px;font-weight:400;color:var(--pv-ink);letter-spacing:0}
    .fo-sec>h2 span{font-family:var(--pv-sans);font-size:12px;color:var(--pv-muted-2)}
    .fo-md-t{font-family:var(--pv-serif);font-size:21px;font-weight:400;letter-spacing:0}
    .fo-panel-h h2{font-family:var(--pv-serif);font-size:24px;font-weight:400;letter-spacing:0;color:var(--pv-ink)}
    .fo-panel-h h2 svg.i{color:var(--pv-bronze)}
    .fo-panel-h small{color:var(--pv-muted)}
    .fo-strip-h h3{font-size:10.5px;font-weight:600;letter-spacing:1.3px;color:var(--pv-bronze)}
    .fo-strip-h h3::before{content:"";width:28px;height:1.5px;background:#c7a978}
    .fo-strip-h small{color:var(--pv-muted-2)}
    .fo-soon h3{font-family:var(--pv-serif);font-weight:400;font-size:24px;letter-spacing:0}
    .fo-soon p{color:var(--pv-muted)}
    .fo-soon .ic{border-color:var(--pv-line);color:var(--pv-bronze);background:linear-gradient(#fcfbf9,#f8f5f2)}

    /* Collaboration: "Why you should meet" company cards (2 x 2). --cb = brand accent, --cb-soft = its pale tint */
    .cb-card{background:#fff;border:1px solid var(--pv-line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;
      box-shadow:0 1px 2px rgba(28,25,23,.04)}
    .cb-hd{display:flex;align-items:center;gap:10px;min-width:0;padding:2px 2px 0}
    .cb-logo{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cb-soft);color:var(--cb);
      font-size:13px;font-weight:800;letter-spacing:-.02em;border:1px solid rgba(28,25,23,.06);overflow:hidden}
    .cb-logo.img{background:#fff;padding:5px}
    .cb-logo img{width:100%;height:100%;object-fit:contain}
    .cb-id{flex:1;min-width:0}
    .cb-nm{font-family:var(--pv-serif);font-size:18px;line-height:1.25;color:var(--pv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cb-meta{font-size:12.5px;color:var(--pv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cb-meta i{font-style:normal;margin:0 4px;opacity:.6}
    .cb-tag{flex:none;align-self:flex-start;height:26px;padding:0 12px;border-radius:999px;background:#2F80ED;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;
      cursor:pointer;transition:background .2s,box-shadow .2s;box-shadow:0 2px 6px rgba(47,128,237,.25)}
    .cb-tag:hover{background:#1C6BD6}
    .cb-tag:focus-visible{outline:2px solid #2F80ED;outline-offset:2px}

    /* Team popup (list of a company's people → "How <name> is valuable to you") */
    .cbm-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;font-family:var(--pv-sans);color:var(--pv-ink)}
    .cbm-bg{position:absolute;inset:0;background:rgba(28,25,23,.38);animation:cbmFade .2s ease both}
    .cbm-box{position:relative;width:100%;max-width:420px;height:min(640px,calc(100dvh - 32px));background:#fff;border-radius:22px;
      box-shadow:0 24px 60px -20px rgba(28,25,23,.45);display:flex;flex-direction:column;overflow:hidden;animation:cbmIn .25s cubic-bezier(.22,1,.36,1) both}
    @keyframes cbmFade{from{opacity:0}}
    @keyframes cbmIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
    @media (prefers-reduced-motion:reduce){.cbm-bg,.cbm-box{animation:none}}
    .cbm-hd{flex:none;display:flex;align-items:center;gap:12px;padding:16px 16px 14px 18px;border-bottom:1px solid var(--pv-line)}
    .cbm-t{font-family:var(--pv-serif);font-weight:400;font-size:19px;line-height:1.25;color:var(--pv-ink)}
    .cbm-s{font-size:12.5px;color:var(--pv-muted);margin-top:1px}
    .cbm-x{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--pv-ink);cursor:pointer;transition:background .2s}
    .cbm-x:hover{background:#F3EFEA}
    .cbm-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;padding:4px 18px 8px}
    .cbm-list::-webkit-scrollbar{display:none}
    .cbm-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--pv-line)}
    .cbm-row:last-child{border-bottom:0}
    .cbm-av{flex:none;position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#EFE9E2;display:grid;place-items:center;border:1px solid rgba(28,25,23,.08)}
    .cbm-av i{font-style:normal;font-size:13px;font-weight:700;color:#7B5E3B}
    .cbm-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .cbm-nm{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--pv-serif);font-size:16px;color:var(--pv-ink)}
    .cbm-nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cbm-tick{flex:none;width:17px;height:17px}
    .cbm-role{font-size:12.5px;color:#4A4540;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cbm-find{flex:none;height:32px;padding:0 14px;border-radius:999px;background:#2F80ED;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
    .cbm-find:hover{background:#1C6BD6}
    .cbm-find:focus-visible,.cbm-x:focus-visible,.cbm-profile:focus-visible{outline:2px solid #2F80ED;outline-offset:2px}
    .cbm-vals{padding-top:12px}
    .cbm-who{display:flex;align-items:center;gap:12px;padding:4px 0 14px;border-bottom:1px solid var(--pv-line)}
    .cbm-v{padding:16px 0;border-bottom:1px solid var(--pv-line)}
    .cbm-v:last-child{border-bottom:0}
    .cbm-v h3{display:flex;align-items:center;gap:10px;font-family:var(--pv-serif);font-weight:700;font-size:17px;color:var(--pv-ink)}
    .cbm-v h3 span{width:28px;height:28px;border-radius:8px;background:#F3EFEA;display:grid;place-items:center;font-size:15px}
    .cbm-v p{margin:8px 0 0 38px;font-family:var(--pv-serif);font-size:15px;line-height:1.6;color:#3F3A36}
    .cbm-v b{font-weight:700;color:var(--pv-ink)}
    .cbm-foot{flex:none;padding:12px 18px 18px;display:flex;justify-content:center;border-top:1px solid var(--pv-line)}
    .cbm-profile{height:42px;min-width:180px;padding:0 28px;border-radius:999px;background:#A8282E;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
    .cbm-profile:hover{background:#8C1F25}

    /* Member profile page (opens from "View Profile"): mirrors the native app's profile screen, in Privé's light style */
    .pf-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;font-family:var(--pv-sans);color:var(--pv-ink)}
    .pf-bg{position:absolute;inset:0;background:rgba(28,25,23,.45);animation:cbmFade .2s ease both}
    .pf-page{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--pv-paper);display:flex;flex-direction:column;overflow:hidden;animation:pfIn .25s cubic-bezier(.2,.8,.2,1) both}
    @media (min-width:480px){.pf-page{height:min(820px,calc(100dvh - 32px));border-radius:22px;box-shadow:0 24px 60px rgba(28,25,23,.25)}}
    @keyframes pfIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.pf-bg,.pf-page{animation:none}}
    .pf-top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 8px;background:var(--pv-paper);border-bottom:1px solid var(--pv-line)}
    .pf-top h2{flex:1;font-family:var(--pv-serif);font-size:17px}
    .pf-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 14px 28px}
    .pf-body::-webkit-scrollbar{display:none}
    .pf-hero{margin:0 -14px;padding:22px 18px 18px;position:relative}
    .pf-hero::before{content:"";position:absolute;inset:0 0 auto;height:74px;background:var(--pf-soft)}
    .pf-av{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#EFE9E2;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 10px rgba(28,25,23,.12)}
    .pf-av i{font-style:normal;font-size:24px;font-weight:700;color:#7B5E3B}
    .pf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .pf-name{display:flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--pv-serif);font-size:26px;line-height:1.2}
    .pf-name .cbm-tick{width:22px;height:22px}
    .pf-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:#4A4540}
    .pf-meta svg{flex:none;color:var(--pv-muted)}
    .pf-cardrow{display:flex;align-items:center;gap:14px;margin-top:16px}
    .pf-dcard{flex:none;width:64px;height:92px;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;background:var(--pf-accent);box-shadow:0 4px 12px rgba(28,25,23,.18)}
    .pf-dcard img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.8);background:#EFE9E2}
    .pf-dcard b{font-size:7.5px;line-height:1.2;text-align:center;font-weight:600}
    .pf-dcard span{display:block;width:70%;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
    .pf-acts{flex:1;display:flex;justify-content:space-around}
    .pf-act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--pv-ink);cursor:pointer;background:none}
    .pf-act > span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--pv-line);transition:background .2s}
    .pf-act:hover > span{background:#F3EFEA}
    .pf-act.on > span{background:#A8282E;border-color:#A8282E;color:#fff}
    .pf-sec{margin-top:12px;background:#fff;border:1px solid var(--pv-line);border-radius:18px;padding:16px}
    .pf-sec h3{font-family:var(--pv-serif);font-size:18px;font-weight:700}
    .pf-note{font-size:12.5px;line-height:1.5;color:var(--pv-muted);margin-top:4px}
    .pf-slides{display:flex;gap:10px;margin:12px -16px 0;padding:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
    .pf-slides::-webkit-scrollbar{display:none}
    .pf-slides img{flex:none;width:58%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;scroll-snap-align:start;border:1px solid var(--pv-line);background:#F3EFEA}
    .pf-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pf-link{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#F3EFEA;font-size:12.5px;font-weight:500;color:var(--pv-ink);cursor:pointer}
    .pf-link:hover{background:#ECE4DC}
    .pf-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pf-tags li{padding:6px 12px;border-radius:999px;border:1px solid var(--pv-line);background:var(--pv-cream);font-size:13px;color:var(--pv-ink)}
    .pf-about{font-family:var(--pv-serif);font-size:19px;line-height:1.45;color:#3F3A36}
    .pf-about b{color:var(--pv-ink)}
    .pf-empty{margin-top:12px;padding:16px;border:1px dashed #DCD2C7;border-radius:14px;text-align:center;font-size:13px;color:var(--pv-muted)}
    .pf-rate{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--pv-line)}
    .pf-rate:last-child{border-bottom:0;padding-bottom:0}
    .pf-rate strong{flex:none;min-width:44px;font-family:var(--pv-serif);font-size:28px;font-weight:700;color:var(--pv-ink)}
    .pf-rate p{flex:1;font-size:13.5px;line-height:1.45;color:#4A4540}
    .pf-agree{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--pv-line);font-size:12.5px;font-weight:600;color:var(--pv-ink);cursor:pointer;background:#fff;transition:background .2s}
    .pf-agree:hover{background:#F3EFEA}
    .pf-agree[aria-pressed="true"]{background:#A8282E;border-color:#A8282E;color:#fff}
    .pf-private{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--pv-muted);padding:0 4px}
    .pf-private svg{flex:none;margin-top:1px}
    .pf-wrap :focus-visible{outline:2px solid #2F80ED;outline-offset:2px}
    .cb-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none;border-radius:16px}
    .cb-track::-webkit-scrollbar{display:none}
    .cb-track:focus-visible{outline:2px solid #C9A14A;outline-offset:2px}
    .cb-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--cb-soft),#F6F2EC)}
    .cb-slide.alt{background:var(--cb-soft)}
    .cb-pair{display:flex;align-items:center;gap:8px;margin-bottom:14px}
    .cb-pair b{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--cb);color:#fff;font-size:11.5px;font-weight:700;
      border:2px solid #fff;box-shadow:0 2px 6px rgba(28,25,23,.12)}
    .cb-pair b.me{background:#7B5E3B}
    .cb-pair i{width:26px;height:2px;border-radius:2px;background:var(--cb)}
    .cb-k{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--cb);margin-bottom:8px}
    .cb-h{font-family:var(--pv-serif);font-weight:700;font-size:clamp(19px,1.6vw,22px);line-height:1.22;color:var(--pv-ink)}
    .cb-h.sm{font-size:clamp(18px,1.45vw,20px)}
    .cb-h em{font-style:normal;color:var(--cb)}
    .cb-h::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:#BA8A3E;margin-top:10px}
    .cb-p{margin-top:10px;font-size:13px;line-height:1.55;color:#3F3A36}
    .cb-sub{margin:14px 0 6px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cb)}
    .cb-chips{display:flex;flex-wrap:wrap;gap:6px}
    .cb-chips span{height:26px;padding:0 11px;border-radius:999px;border:1.5px solid var(--cb);color:var(--pv-ink);background:rgba(255,255,255,.6);font-size:12px;font-weight:500;display:inline-flex;align-items:center}
    .cb-pts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
    .cb-pts li{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:11px 12px;box-shadow:0 1px 2px rgba(28,25,23,.06)}
    .cb-pts .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--cb);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
    .cb-pts div>b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--pv-ink)}
    .cb-pts p{margin-top:3px;font-size:12.5px;line-height:1.45;color:#4A4540}
    .cb-meet{margin-top:14px;height:34px;padding:0 14px;border-radius:999px;background:#2F80ED;color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .2s}
    .cb-meet:hover{background:#1C6BD6}
    .cb-bars{display:flex;gap:6px;padding:0 4px 2px}
    .cb-bars button{flex:1;height:4px;border-radius:4px;background:#DDD6CF;cursor:pointer;transition:background .2s;position:relative}
    .cb-bars button::before{content:"";position:absolute;inset:-8px 0}
    .cb-bars button:hover{background:#C9BFB6}
    .cb-bars button.on{background:var(--pv-ink)}
    /* Image slides (assets/slides, 2:3 portrait): the picture fills the slide */
    .cb-slide.cb-img{margin:0;padding:0;aspect-ratio:2/3;background:#EEF4F6;overflow:hidden}
    .cb-slide.cb-img img{display:block;width:100%;height:100%;object-fit:cover;user-select:none}
    /* Auto-advance: past bars dark, the current one fills up (--p, 0 to 1) as its countdown, later ones pale */
    .cb-bars button.done{background:var(--pv-ink)}
    @media (prefers-reduced-motion:no-preference){
      .cb-bars button.on{background:#DDD6CF;overflow:hidden}
      .cb-bars button.on::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0) * 100%);border-radius:inherit;background:var(--pv-ink)}
    }
    .cb-bars button:focus-visible{outline:2px solid #C9A14A;outline-offset:3px}
    .fo-empty b{font-family:var(--pv-serif);font-weight:400;font-size:18px}
    .tk-nm{font-family:var(--pv-serif);font-weight:400;font-size:17px;letter-spacing:0}
    .tk-stat b{font-family:var(--pv-serif);font-weight:700;letter-spacing:0;color:var(--pv-ink-2)}
    .tk-stat span{color:var(--pv-muted)}
    .fo-ev-t{font-family:var(--pv-serif);font-weight:400;letter-spacing:0}
    .fo-ev-d{color:var(--pv-burgundy);letter-spacing:.04em;text-transform:uppercase;font-size:11px}

    /* ---- Buttons: Privé pills. Secondary = white with gold outline; primary = bronze ---- */
    .fo-b{height:40px;padding:0 20px;border-radius:999px;font-weight:500;font-size:14px;border:1.5px solid var(--pv-gold-soft)!important;color:var(--pv-ink)!important;
      box-shadow:0 2px 10px rgba(0,0,0,.05);transition:background-color .2s,box-shadow .2s,color .2s,transform .15s}
    .fo-b:hover{background:#fbf7f0!important;box-shadow:0 4px 14px rgba(0,0,0,.08)}
    .fo-b.pri{background:var(--pv-bronze)!important;border-color:var(--pv-bronze)!important;color:#fff!important}
    .fo-b.pri:hover{background:var(--pv-bronze-dark)!important;opacity:1;box-shadow:0 8px 26px rgba(0,0,0,.2)}
    .fo-b.sm{height:32px;padding:0 14px;font-size:12.5px;border-width:1px!important}
    .fo-b:focus-visible,.fo-tb:focus-visible{outline:2px solid var(--pv-gold);outline-offset:3px}
    .fo-ob .fo-b{height:42px;border-radius:999px}
    .fo-ob .fo-b.pri{padding:0 22px}

    /* chips, filters, segmented controls */
    .fo-chip,.tk-chip{border-color:var(--pv-line)!important;font-weight:500}
    .fo-chip:hover,.tk-chip:hover{background:#fbf7f0!important;border-color:var(--pv-gold-soft)!important;color:var(--pv-ink)!important}
    .fo-chip.on,.tk-chip.on{background:var(--pv-bronze)!important;border-color:var(--pv-bronze)!important;color:#fff!important}
    .fo-seg{background:#f5f0ec}
    .fo-seg button.on{color:var(--pv-bronze);box-shadow:0 1px 3px rgba(28,25,23,.12)}
    .fo-ck.on,.fo-tg input:checked+.fo-sw,.fo-step.on .n,.fo-progress span.on,.fo-num{background:var(--pv-bronze);border-color:var(--pv-bronze)}
    .fo-num{color:#fff}
    .fo-tag{border-radius:6px;font-weight:600;background:#f5f0ec;color:var(--pv-bronze-ink)}
    .fo-tag.on{background:#f1dfd9;color:var(--pv-burgundy)}
    .fo-tag.now{background:#eaf1e8;color:#3f6b45}

    /* inputs */
    .fo-field,.fo-inp{border-color:var(--pv-line);border-radius:10px;transition:border-color .15s,box-shadow .15s}
    .fo-field:hover,.fo-inp:hover{border-color:#d9c6a8}
    .fo-field:focus,.fo-inp:focus{border-color:var(--pv-gold);box-shadow:0 0 0 3px rgba(201,161,74,.18)}
    .fo-label{color:var(--pv-ink)}

    /* ---- Cards & panels: warm gradient surfaces like Privé's function cards ---- */
    .fo-card{border-color:var(--pv-line);border-radius:14px}
    .fo-panel{border-color:#efe5dc;border-radius:18px}
    .fo-box{background:linear-gradient(#fcfbf9,#f8f5f2);border:1px solid var(--pv-line);border-radius:10px}
    .tk-stat{border-color:var(--pv-line);border-radius:12px;background:linear-gradient(#fcfbf9,#f8f5f2)}
    .tk-pts .n{background:#f5eee4;color:var(--pv-bronze-ink);font-family:var(--pv-serif)}
    .fo-ev{border-color:var(--pv-line)}
    .fo-ev:hover{border-color:#e2d6c8;box-shadow:0 18px 40px -18px rgba(0,0,0,.25)}
    .fo-table th{background:var(--pv-linen);color:var(--pv-muted)}
    .fo-row:hover,.fo-table tbody tr:hover{background:#fbf7f0}
    .fo-logo{background:linear-gradient(135deg,#8a6a3a,#c9a14a);font-family:var(--pv-serif)}

    /* ---- Event poster cards: Privé "Previously at Privé" cards ---- */
    .fo-pc{border-radius:12px;background:#111;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
    .fo-pc:hover{box-shadow:0 24px 48px -18px rgba(0,0,0,.55);transform:translateY(-3px)}
    .fo-pc-blur{-webkit-backdrop-filter:none;backdrop-filter:none;-webkit-mask-image:none;mask-image:none;height:100%;
      background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.15) 42%,transparent 68%)}
    .fo-pc-b{padding:16px}
    .fo-pc-b h3{font-family:var(--pv-serif);font-weight:500;font-size:19px;line-height:1.18;letter-spacing:0;text-shadow:none}
    .fo-pc-b h3::before{content:"";display:block;width:28px;height:1.5px;background:#c7a978;margin-bottom:10px}
    .fo-pc-tag{top:12px;left:12px;border-radius:6px;border:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
      font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;line-height:22px;padding:0 9px}
    .fo-pc-cta{height:34px;padding:0 16px;font-size:12.5px;font-weight:500;color:#2c2e29;background:#fff;border:1.5px solid #c9a46a;
      -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .fo-pc:hover .fo-pc-cta{background:#fbf7f0}
    .fo-pc-cta.ghost{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.55);box-shadow:none}
    .fo-pc .fo-pc-cta.ghost:hover{background:#fff;border-color:#fff;color:#2c2e29}
    .fo-strip-nav button{border:1.5px solid var(--pv-burgundy);color:var(--pv-burgundy);background:transparent;width:34px;height:34px}
    .fo-strip-nav button:hover{background:#f6e6e3;border-color:var(--pv-burgundy)}

    /* ---- Popups: Privé modal (24px radius, warm scrim, round grey close) ---- */
    .fo-scrim{background:rgba(22,20,18,.72)}
    .fo-modal{border-radius:24px;border:0;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:28px}
    .fo-md-x{border-radius:50%;background:#e9e7e4;color:#333;width:36px;height:36px}
    .fo-md-x:hover{background:#dedad5;color:#111}
    .fo-md-l{color:var(--pv-bronze);text-transform:uppercase;letter-spacing:1.1px;font-size:10.5px}
    .fo-menu{border-color:var(--pv-line);border-radius:14px;box-shadow:0 18px 40px -12px rgba(28,25,23,.28)}
    .fo-menu button:hover{background:#fbf7f0;color:var(--pv-gold-deep)}

    /* ---- Header: Privé bar — logo left, paper glass, hairline; user pill on the right ---- */
    /* The blur makes the header its own layer, which traps the account menu inside it; so lift the whole header above
       page content (cards, the Top 3/10 filter, "View more" at z 40) but keep it under sheets and modals (z 60+) */
    #topNav{position:relative;z-index:55;height:68px;background:rgba(251,249,247,.92)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--pv-line);padding-left:clamp(12px,3vw,40px);padding-right:clamp(12px,3vw,40px)}
    .fo-brand{gap:12px;padding:0 10px 0 2px}
    .fo-brand:hover{background:transparent}
    .fo-brand:hover .nm{color:var(--pv-gold-deep)}
    .fo-brand .nm{font-family:var(--pv-serif);font-size:18px;font-weight:400;letter-spacing:.005em;transition:color .2s}
    .fo-tb{color:var(--pv-bronze);border-radius:50%}
    .fo-tb:hover,.fo-tb.on{background:#f5eee4;color:var(--pv-bronze-dark)}
    .fo-dot{background:var(--pv-maroon)}
    .fo-me-btn{height:42px;border-radius:999px;border:1.5px solid var(--pv-gold-soft);background:#fff;padding:0 12px 0 4px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .fo-me-btn:hover,.fo-me-btn.on{background:#fbf7f0;box-shadow:0 4px 14px rgba(0,0,0,.1)}
    .fo-me-btn .nm{font-weight:500}
    .fo-me-btn img{width:32px;height:32px}

    /* sub-bar: breadcrumb in serif, two-line bronze burger (Privé menu button) */
    #subBar.fo{height:52px;background:transparent;border-bottom:1px solid var(--pv-line);padding-left:clamp(8px,3vw,36px);padding-right:clamp(8px,3vw,36px)}
    #crumb{font-family:var(--pv-serif);font-size:16px;color:var(--pv-ink)!important;font-weight:400!important}
    .pv-burger{width:40px;height:36px;border-radius:10px;position:relative;display:block}
    .pv-burger span{position:absolute;left:8px;right:8px;height:2.5px;border-radius:2px;background:#8a6a3a;transition:transform .45s cubic-bezier(.76,0,.24,1),background-color .2s}
    .pv-burger span:first-child{top:13px}
    .pv-burger span:nth-child(2){top:20px;right:14px}
    .pv-burger:hover span{background:var(--pv-ink)}
    .pv-burger:hover span:nth-child(2){right:8px}

    /* drawer: Privé menu panel — white, warm scrim, large light links, gold hover */
    #drawer > .absolute.inset-0{background:rgba(0,0,0,.6)!important}
    #drawerPanel{background:#fff!important;border-color:var(--pv-line)!important;width:min(340px,88vw)!important;box-shadow:0 30px 80px rgba(0,0,0,.25)}
    #drawerPanel > div:first-child{height:68px!important;border-color:var(--pv-line)!important}
    .fo-nav-row{height:46px;font-size:17px;letter-spacing:-.02em;color:#2b2b2b;border-radius:10px;position:relative}
    .fo-nav-row svg{color:var(--pv-bronze)}
    .fo-nav-row:hover{background:transparent;color:var(--pv-gold-deep)}
    .fo-nav-row.on{background:#fbf7f0;color:var(--pv-ink);font-weight:500}
    .fo-nav-row.on::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--pv-gold)}
    .fo-lbl{color:var(--pv-bronze);letter-spacing:1.3px;font-size:10.5px}

    /* two-pane admin pages */
    .fo-side{background:linear-gradient(180deg,#fcfbf9,#f8f5f2);border-color:var(--pv-line)}
    .fo-side .brand{font-family:var(--pv-serif);font-weight:400;font-size:17px}
    .fo-side .brand .dot{background:var(--pv-gold)}
    .fo-step.on{background:#fff;box-shadow:inset 0 0 0 1px var(--pv-line)}
    .fo-hr{background:var(--pv-line)}

    /* spinner */
    .fo-spin{border-color:var(--pv-line);border-top-color:var(--pv-gold)}

    /* ---- Dashboard: serif numbers & headings, gold rule under section titles ---- */
    .exec-dashboard .ex-heading::after{content:"";display:block;width:48px;height:3px;border-radius:2px;background:#c9a14a;margin-top:8px}
    .exec-dashboard .ex-insight-hero{font-size:26px;line-height:32px}
    .exec-dashboard .ex-card{border-radius:18px}


    /* ---- Collective intelligence: Privé "What's next" card ----
       Band #F4F1EE · card #FAF9F8, 28px radius, rgba(28,25,23,.07) border · serif 40px title + 60×3 #BA8A3E rule
       Filter: 1.5px #7B5E3B outline, 10px radius, #775E36 text · arrows: 42px circles, 1.5px #6B2B2B
       Media: #EAE5E1 frame (20px radius, 10px pad), 12px inner radius · split: 1.5px #C9A46A · motto: Mencken Head italic */
    .exec-dashboard .ex-card.pv-ci,
    .ev-canvas .exec-dashboard.ex-embed .ex-card.pv-ci{background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible;
      padding:0;color:#1C1917;font-family:var(--pv-sans)}
    .pv-ci-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 clamp(14px,1.8vw,20px);padding:0 clamp(0px,5vw,64px)}
    .pv-ci-title{margin:0;font-family:var(--pv-serif);font-weight:400;font-size:clamp(26px,2.6vw,34px);line-height:1.2;color:#1C1917}
    .pv-ci-rule{width:60px;height:3px;border-radius:2px;background:#BA8A3E;margin-top:6px}
    .pv-ci-filter{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 5px;border:1.5px solid #7B5E3B;border-radius:10px;color:#775E36}
    .pv-ci-spark{display:inline-flex;padding:0 6px 0 7px}
    .pv-ci-seg{height:32px;padding:0 14px;border-radius:7px;font-size:15px;font-weight:500;color:#775E36;cursor:pointer;transition:background .2s,color .2s}
    .pv-ci-seg:hover{background:rgba(123,94,59,.08)}
    .pv-ci-seg.on{background:#7B5E3B;color:#fff}

    .pv-ci-stage{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;grid-template-areas:"prev card next" ". dots .";column-gap:22px;align-items:center;padding:0 6px}
    .pv-ci-arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid #6B2B2B;color:#6B2B2B;display:grid;place-items:center;cursor:pointer;background:transparent;transition:background .2s,color .2s}
    .pv-ci-arrow:hover{background:#6B2B2B;color:#fff}
    .pv-ci-arrow.prev{grid-area:prev}.pv-ci-arrow.next{grid-area:next}
    .pv-ci-dots{grid-area:dots;display:flex;justify-content:center;align-items:center;gap:7px;margin-top:clamp(14px,1.8vw,20px)}
    .pv-ci-dot{height:12px;width:12px;border-radius:999px;background:#D5CECA;cursor:pointer;transition:width .3s ease,background .3s ease}
    .pv-ci-dot:hover{background:#BFB5AE}
    .pv-ci-dot.on{width:34px;background:#E3DBD5;position:relative;overflow:hidden}
    .pv-ci-dot.on::after{content:"";position:absolute;inset:0 auto 0 0;width:100%;border-radius:inherit;background:#6B2B2B}
    @media (prefers-reduced-motion:no-preference){
      .pv-ci:not(.paused) .pv-ci-dot.on::after{width:0;animation:pvDotFill var(--pv-ci-ms,7000ms) linear forwards}
      .pv-ci.holding .pv-ci-dot.on::after{animation-play-state:paused}
      @keyframes pvDotFill{to{width:100%}}
    }
    .pv-ci-play{margin-left:10px;width:28px;height:28px;border-radius:50%;border:1.5px solid #6B2B2B;color:#6B2B2B;display:grid;place-items:center;cursor:pointer;background:transparent;transition:background .2s,color .2s}
    .pv-ci-play:hover{background:#6B2B2B;color:#fff}
    .pv-ci-play:focus-visible{outline:2px solid #C9A14A;outline-offset:3px}

    .pv-ci-card{grid-area:card;position:relative;min-width:0;background:#fff;border-radius:28px;border:1px solid rgba(28,25,23,.07);
      box-shadow:0 1px 2px rgba(28,25,23,.04),0 18px 40px -24px rgba(28,25,23,.22);padding:clamp(18px,2.4vw,28px) clamp(20px,4vw,48px) clamp(16px,2vw,22px)}
    /* Fixed height: all slides share one grid cell, the hidden ones still take up space, so the card is always as
       tall as the tallest action and never grows or shrinks while sliding */
    .pv-ci-stage .pv-ci-card{display:grid;overflow:hidden}
    .pv-ci-slide{grid-area:1/1;min-width:0}
    .pv-ci-ghost{visibility:hidden}
    @media (prefers-reduced-motion:no-preference){
      .pv-ci-slide.pv-in-r{animation:pvInR .5s cubic-bezier(.22,1,.36,1) both}
      .pv-ci-slide.pv-in-l{animation:pvInL .5s cubic-bezier(.22,1,.36,1) both}
      @keyframes pvInR{from{opacity:0;transform:translateX(28px)}}
      @keyframes pvInL{from{opacity:0;transform:translateX(-28px)}}
    }
    .pv-ci-main{display:flex;align-items:flex-start;gap:clamp(28px,4.5vw,56px)}
    /* Text starts at the card's left padding and uses the full width (no centred 820px column) */
    .pv-ci-copy{flex:1;min-width:0;padding-top:4px}
    .pv-ci-kicker{margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:#7B5E3B;display:flex;align-items:center;gap:6px}
    .pv-ci-kicker::before{content:"";width:28px;height:1.5px;background:#C7A978;margin-right:4px}
    .pv-ci-kicker b{font-weight:700;color:#6B2B2B}
    .pv-ci-of{color:#9D8079}
    .pv-ci-h{margin:0;font-family:var(--pv-serif);font-weight:400;font-size:clamp(22px,2.2vw,27px);line-height:1.45;color:#1C1917}

const NOW = new Date(); // real today: the events come from events.ts, so upcoming vs completed follows the calendar
const DAY = { weekday: "short", day: "2-digit", month: "short" };
const fmtDay = (d, withYear) => new Date(d).toLocaleDateString("en-GB", withYear ? { ...DAY, year: "numeric" } : DAY);
const fmtTime = (d) => new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
// live = happening today (running now or later today), upcoming = a later day, past = already over
const endOfToday = new Date(NOW); endOfToday.setHours(23, 59, 59, 999);
const statusOf = (e) =>
  new Date(e.end) < NOW ? "past" : new Date(e.start) <= endOfToday ? "live" : "upcoming";
const isPast = (e) => statusOf(e) === "past";

const STATUS = {
  live: { label: "Live", badge: "bg-[#EAF1E8] text-[#3F6B45]" },
  upcoming: { label: "Upcoming", badge: "bg-white/90 text-[#8A1C1C]" },
  past: { label: "Past", badge: "bg-white/90 text-[#6F6A5F]" },
};
// Main page tabs: Live + Upcoming are merged into one list, Past stays separate
const TABS = {
  current: { label: "Practices", heading: "Events", icon: "live" },
  past: { label: "Past", heading: "Past Events", icon: "past" },
};
const EVENT_TABS = ["current", "past"];
const DEFAULT_TAB = "current";
const tabOf = (e) => (isPast(e) ? "past" : "current");
const badgeText = (e) => STATUS[statusOf(e)].label;

// Past: newest first. Live & Upcoming: live events first, then upcoming, each by date
const eventsFor = (tab) => {
  const list = NETWORK_EVENTS.filter((e) => tabOf(e) === tab);
  const rank = (e) => (statusOf(e) === "live" ? 0 : 1);
  return tab === "past"
    ? list.sort((a, b) => new Date(b.start) - new Date(a.start))
    : list.sort((a, b) => rank(a) - rank(b) || new Date(a.start) - new Date(b.start));
};
const dateRange = (e) => sameDay(e.start, e.end) ? fmtDay(e.start, true) : `${fmtDay(e.start)} - ${fmtDay(e.end, true)}`;
const timeRange = (e) => e.hasTime === false ? "Time to be announced" : `${fmtTime(e.start).replace(/ ?[AP]M/, "")} - ${fmtTime(e.end)}`;
// "Fri, 27 Nov 2026 · 9:30 AM", or just the date when events.ts has no time for it
const whenText = (e) => e.hasTime === false ? dateRange(e) : `${dateRange(e)} · ${fmtTime(e.start)}`;
const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => n.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();

const AVATAR_TONES = [["#F5EEE4", "#7B5E3B"], ["#EAF1E8", "#3F6B45"], ["#FBF1DE", "#8A5A12"], ["#F6E6E3", "#6B2B2B"], ["#F4E9EC", "#8A3B4F"], ["#E7EFEE", "#3D6663"]];
// Coloured initials (same tones as Attendees.jsx) sit behind the photo, so they show if it fails to load
const face = (src, name, size = "w-10 h-10 text-[14px]") => {
  const hash = [...name].reduce((h, c) => h + c.charCodeAt(0), 0);
  const [bg, fg] = AVATAR_TONES[hash % AVATAR_TONES.length];
  return `<span class="${size} relative rounded-full shrink-0 grid place-items-center font-semibold overflow-hidden" style="background:${bg};color:${fg}">
    ${initials(name)}
    <img src="${src}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()" />
  </span>`;
};

// title and action sitting on the blur. No date or venue.
function posterCard(e) {

  // Upcoming / live, already registered: one "Open Smart Notes" button (and the whole card) opens Smart Notes.
  // Past: one "More details" button (and the whole card) opens the side sheet. No status tag on the photo.
  const done = isPast(e);
  const regOpen = e.registrationOpen !== false;
  const notes = !done && e.registered === true;
  const href = notes ? `#/smart-notes/${e.id}` : !done && regOpen ? `#/register/${e.id}` : "";

// "More below" pill: the Collective intelligence card fills most of the first screen, so the events and
// Collaboration panels start below the fold. While they're off screen, a pill floats at the bottom of the page
// saying what's down there; clicking it scrolls to them. It hides once the panels come into view.
// Pinned to the bottom of the screen, centred; hidden as soon as the top of the panels is on screen.
function pvMorePill(n) {
  return `<div class="pv-more-slot" aria-hidden="true">
    <button type="button" data-pv-more tabindex="-1" class="pv-more" aria-label="Scroll to Practices and Collaboration">
      ${FI.date}<span>Practices</span><b class="ex-num">${n}</b><span class="pv-more-sep">·</span><span>Collaboration</span>
      <span class="pv-more-bob">${FI.chevron}</span>
    </button>
  </div>`;
}
// Show only while the panels are fully below the bottom of the screen (none of their headings visible).
// Plain position check on scroll / resize / font load, so it's always in step with the real layout.
function pvUpdateMore() {
  const target = document.getElementById("lvPanels");
  const pill = document.querySelector("[data-pv-more]");
  if (!target || !pill) return;
  const show = target.getBoundingClientRect().top > window.innerHeight - 24;
  if (pill.classList.contains("on") === show) return;
  pill.classList.toggle("on", show);
  pill.tabIndex = show ? 0 : -1;
  pill.parentElement.setAttribute("aria-hidden", String(!show));
}
function pvWatchBelow() {
  pvUpdateMore();
  document.fonts?.ready.then(pvUpdateMore);
  setTimeout(pvUpdateMore, 400); // after the card's rise-in animation settles
}
document.getElementById("app").addEventListener("scroll", pvUpdateMore, { passive: true });
window.addEventListener("resize", pvUpdateMore);
// Sideways carousels (event strips, Collaboration slides) are horizontal scroll boxes. On a touchpad, a slightly
// diagonal swipe latches onto them and the up/down part is lost, so the page "won't scroll" over them.
// Hand mostly-vertical wheel input to the nearest box that can scroll vertically (panel list, else the page).
document.addEventListener("wheel", (ev) => {
  if (ev.ctrlKey || Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
  const strip = ev.target.closest?.(".fo-strip-row, .cb-track, .ex-noscroll");
  if (!strip) return;
  const dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? innerHeight : 1);
  for (let el = strip.parentElement; el && el !== document.body; el = el.parentElement) {
    if (!/auto|scroll/.test(getComputedStyle(el).overflowY) || el.scrollHeight <= el.clientHeight + 1) continue;
    const room = dy > 0 ? el.scrollHeight - el.clientHeight - el.scrollTop : el.scrollTop;
    if (room < 1) continue;
    ev.preventDefault();
    el.scrollTop += dy;
    return;
  }
}, { passive: false });
document.addEventListener("click", (ev) => {
  if (!ev.target.closest("[data-pv-more]")) return;
  const target = document.getElementById("lvPanels");
  target?.scrollIntoView({ behavior: "smooth", block: "start" });
  target?.querySelector(".fo-strip-row")?.focus({ preventScroll: true });
});

function openEventSheet(id, from) {

  let host = document.getElementById("evSheetHost");
  if (!host) { host = document.createElement("div"); host.id = "evSheetHost"; document.body.append(host); }
  host.innerHTML = renderEventSheet(e);
  evSheet.anim = false; // later re-renders (paging) don't slide in again
  document.getElementById("evSheetClose").focus();
}

// Collective intelligence paging inside the sheet: re-render in place, keep the scroll position
function pageEventSheet(dir) {
  const host = document.getElementById("evSheetHost");
  const e = NETWORK_EVENTS.find((x) => x.id === evSheet.id);
  if (!host || !e) return;
  const top = host.querySelector(".ex-sheet-body").scrollTop;
  evSheet.ciPage += dir;
  host.innerHTML = renderEventSheet(e);
  host.querySelector(".ex-sheet-body").scrollTop = top;
  host.querySelector(`[data-ev-ci="${dir}"]:not([disabled])`)?.focus({ preventScroll: true });
}

function closeEventSheet() {
  const host = document.getElementById("evSheetHost");
  if (!evSheet.id || !host) return;
  host.innerHTML = "";
  const from = evSheet.from;
  evSheet = { id: null, from: null, ciPage: 0, anim: false };
  if (from && document.contains(from)) from.focus();
}

function openTeamPop(id, person, from) {
  const c = COLLAB.find((x) => x.id === id);
  if (!c) return;
  teamPop = { id, person, from: from || teamPop.from };
  let host = document.getElementById("teamPopHost");
  if (!host) { host = document.createElement("div"); host.id = "teamPopHost"; document.body.append(host); }
  host.innerHTML = teamPopHTML(c, person);
  (host.querySelector("[data-team-back]") || host.querySelector(".cbm-x"))?.focus();
}
function closeTeamPop() {
  const host = document.getElementById("teamPopHost");
  if (host) host.innerHTML = "";
  const from = teamPop.from;
  teamPop = { id: null, person: null, from: null };
  if (from && document.contains(from)) from.focus();
}
window.addEventListener("hashchange", () => { if (teamPop.id) closeTeamPop(); });

document.addEventListener("click", (ev) => {
  const t = ev.target;
  const team = t.closest("[data-collab-team]");
  if (team) return openTeamPop(team.dataset.collabTeam, null, team);
  if (!teamPop.id) return;
  if (t.closest("[data-team-close]")) return closeTeamPop();
  if (t.closest("[data-team-back]")) return openTeamPop(teamPop.id, null);
  const find = t.closest("[data-team-find]");
  if (find) return openTeamPop(teamPop.id, Number(find.dataset.teamFind));
  const prof = t.closest("[data-team-profile]");
  if (prof) openProfile(teamPop.id, teamPop.person, prof);
});
