function openProfile(id, person, from) {
  const c = COLLAB.find((x) => x.id === id);
  const x = (COLLAB_TEAM[id] || [])[person];
  if (!c || !x) return;
  const same = profPop.id === id && profPop.person === person;
  profPop = same ? { ...profPop } : { id, person, from: from || null, agreed: [false, false], saved: false };
  let host = document.getElementById("profHost");
  if (!host) { host = document.createElement("div"); host.id = "profHost"; document.body.append(host); }
  const scroll = host.querySelector(".pf-body")?.scrollTop || 0;
  host.innerHTML = profileHTML(c, x);
  if (same) { host.querySelector(".pf-body").scrollTop = scroll; return; }
  host.querySelector("[data-prof-close].cbm-x")?.focus();
}
function closeProfile() {
  const host = document.getElementById("profHost");
  if (host) host.innerHTML = "";
  const from = profPop.from;
  profPop = { id: null, person: null, from: null, agreed: [false, false] };
  if (from && document.contains(from)) from.focus();
}
window.addEventListener("hashchange", () => { if (profPop.id) closeProfile(); });

document.addEventListener("click", (ev) => {
  if (!profPop.id) return;
  const t = ev.target;
  if (t.closest("[data-prof-close]")) return closeProfile();
  const x = COLLAB_TEAM[profPop.id][profPop.person];
  const first = x.name.replace(/^Dr\. /, "").split(" ")[0];
  const rate = t.closest("[data-prof-rate]");
  if (rate) {
    const i = Number(rate.dataset.profRate);
    profPop.agreed[i] = !profPop.agreed[i];
    openProfile(profPop.id, profPop.person);
    return document.querySelector(`[data-prof-rate="${i}"]`)?.focus();
  }
  const act = t.closest("[data-prof-act]")?.dataset.profAct;
  if (act === "save") {
    profPop.saved = !profPop.saved;
    openProfile(profPop.id, profPop.person);
    document.querySelector('[data-prof-act="save"]')?.focus();
    return toast(profPop.saved ? `${first}'s card is saved to your contacts` : `${first}'s card is removed from your contacts`);
  }
  if (act === "share") return toast(`A link to ${first}'s profile is ready to share`);
  if (act === "message") return toast(`Messaging ${first} is coming soon`);
  if (act === "linkedin" || act === "website") return toast(`${first}'s ${act === "linkedin" ? "LinkedIn" : "website"} opens in the app`);
});

// Bars: click jumps to that slide; scrolling the row (swipe / trackpad) moves the dark bar along
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-collab-go]");
  if (!b) return;
  const [id, j] = b.dataset.collabGo.split(":");
  const track = document.querySelector(`[data-collab-track="${id}"]`);
  const slide = track?.children[Number(j)];
  if (slide) track.scrollTo({ left: slide.offsetLeft - track.firstElementChild.offsetLeft, behavior: "smooth" });
});
document.addEventListener("scroll", (ev) => {
  const track = ev.target;
  if (!(track instanceof Element) || !track.matches("[data-collab-track]")) return;
  const step = track.children[1] ? track.children[1].offsetLeft - track.children[0].offsetLeft : track.clientWidth;
  const i = Math.round(track.scrollLeft / step);
  track.closest(".cb-card").querySelectorAll("[data-collab-go]").forEach((btn, j) => {
    btn.classList.toggle("on", j === i);
    btn.classList.toggle("done", j < i);
    btn.setAttribute("aria-current", String(j === i));
  });
}, { capture: true, passive: true });

// Auto-advance (timeout based): each card moves to its next slide every CB_MS, looping back to the first.
// The current bar fills up as the countdown. A card holds while the pointer is over it or focus is inside it,
// and every card holds while the tab is hidden or the team popup is open. Any slide change (swipe, bar click
// or auto) restarts that card's countdown. Off when the person has asked for reduced motion.
const CB_MS = 5000;
const cbTimer = new WeakMap(); // card -> { i: slide index last seen, t: ms elapsed on it }
let cbLast = 0;
setInterval(() => {
  const now = performance.now();
  const dt = Math.min(now - (cbLast || now), 250);
  cbLast = now;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const holdAll = document.hidden || !!teamPop.id;
  document.querySelectorAll(".cb-card").forEach((card) => {
    const track = card.querySelector("[data-collab-track]");
    const bars = [...card.querySelectorAll("[data-collab-go]")];
    if (!track || bars.length < 2) return;
    const i = Math.max(0, bars.findIndex((b) => b.classList.contains("on")));
    let s = cbTimer.get(card);
    if (!s || s.i !== i) { s = { i, t: 0 }; cbTimer.set(card, s); }
    if (!holdAll && !card.matches(":hover") && !card.contains(document.activeElement)) s.t += dt;
    bars.forEach((b, j) => b.style.setProperty("--p", j === i ? Math.min(s.t / CB_MS, 1).toFixed(3) : 0));
    if (s.t < CB_MS) return;
    s.t = 0;
    const next = (i + 1) % bars.length;
    const slide = track.children[next];
    track.scrollTo({ left: slide.offsetLeft - track.firstElementChild.offsetLeft, behavior: "smooth" });
  });
}, 100);

/* ---------- business rules ---------- */
const EX_DAY = 86400000;
function exFinancialYear(date) {
  const d = new Date(date);
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return { start: new Date(y, 3, 1), end: new Date(y + 1, 2, 31), label: `FY${String(y + 1).slice(2)}` };
}
// Pace = % of the financial year elapsed as of the data date
function exPace(asOf) {
  const { start, end } = exFinancialYear(asOf);
  return Math.round(((Math.floor((new Date(asOf) - start) / EX_DAY) + 1) / ((end - start) / EX_DAY + 1)) * 100);
}
// Key result: on track if >= pace - 5, at risk if >= pace - 15, else off track
const exKrStatus = (progress, pace) => (progress >= pace - 5 ? "good" : progress >= pace - 15 ? "watch" : "bad");// Goal health = (on track x 1 + at risk x 0.5) / total x 100
const EX_STATUS_LABEL = { good: "On track", watch: "At risk", bad: "Off track" };
const exShortDate = (iso) => new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
const exDaysUntil = (iso, asOf) => Math.ceil((new Date(`${iso.slice(0, 10)}T23:59:59`) - new Date(asOf)) / EX_DAY);
const exInitials = (name) => name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();

// Goals for the chosen sector, scored against pace, then joined to their events
function exModel(data, sector) {
  const pace = exPace(data.asOf);
  const krs = data.keyResults.map((kr) => {
    const progress = kr.progress[sector];
    return { ...kr, progress, status: exKrStatus(progress, pace) };
  });
  return exOverview(data, krs);
}

// Overview: events joined to the goals they serve, rolled up per goal and per area.
// Attendance = attended / invited over events that have happened.
// Lift = AI-estimated progress points the takeaways add to a goal, if acted on.
function exOverview(data, krs) {
  // done = the event has ended by the data date; newest first
  // area = the area of the one goal the event serves (Growth or Technology)
  const events = data.events.map((e) => {
    const area = data.areas.find((a) => a.id === krs.find((k) => e.goals[k.id])?.area);
    return { ...e, done: new Date(e.end) < new Date(data.asOf), area: area?.id, areaName: area?.name };
  }).sort((a, b) => b.start.localeCompare(a.start));
  const goals = krs.map((k) => ({ ...k, events: events.filter((e) => e.goals[k.id]) }));
  const areas = data.areas.map((a) => {
    const gs = goals.filter((g) => g.area === a.id);
    const list = events.filter((e) => gs.some((g) => e.goals[g.id]));
    return { ...a, goals: gs, events: list, attendees: list.filter((e) => e.done).reduce((t, e) => t + (e.came || 0), 0) };
  });
  return { events, goals, areas };
}

// ---- Auto-advance: the slider moves to the next action every PV_CI_MS.
// It holds while the pointer is over the card, while keyboard focus is inside it, while the tab is hidden or an
// event sheet is open, and stops entirely when the pause button is pressed. The active dot fills up as the countdown.
// Only the card is re-rendered on each step (not the whole page), so the event rows below keep their scroll position.
const PV_CI_MS = 7000;
const pvCi = { dot: null, t: 0, last: 0 };
function pvCiTick() {
  const now = performance.now();
  const dt = Math.min(now - (pvCi.last || now), 250);
  pvCi.last = now;
  const sec = document.querySelector(".pv-ci");
  const dot = sec?.querySelector(".pv-ci-dot.on");
  if (!sec || !dot) return;
  if (dot !== pvCi.dot) { pvCi.dot = dot; pvCi.t = 0; } // new slide (auto or manual): restart the countdown
  const n = sec.querySelectorAll(".pv-ci-dot").length;
  const hold = n < 2 || document.hidden || !!exState.event || sec.matches(":hover") || !!sec.querySelector(":focus-visible");
  sec.classList.toggle("holding", hold);
  if (hold || exState.ciPaused) return;
  pvCi.t += dt;
  if (pvCi.t < PV_CI_MS) return;
  exState.ciSlide += 1;
  exState.ciAnim = 1;
  sec.outerHTML = exCollective(null, sec.classList.contains("no-title"));
  if (typeof pvUpdateMore === "function") pvUpdateMore();
}
setInterval(pvCiTick, 100);

// Pause / play
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-pv-ci-play]");
  if (!b) return;
  exState.ciPaused = !exState.ciPaused;
  pvCi.dot = null; // playing again starts a fresh countdown
  const sec = b.closest(".pv-ci");
  sec.outerHTML = exCollective(null, sec.classList.contains("no-title"));
  document.querySelector("[data-pv-ci-play]")?.focus();
});

function exEventsPill(o) {
  const show = exState.evPill && !exState.event;
  return `<div class="sticky bottom-5 z-20 h-0 -mt-5 flex justify-center items-end pointer-events-none ex-no-print" aria-hidden="${!show}">
    <button type="button" data-ex-jump-events tabindex="${show ? 0 : -1}" aria-label="Jump to events"
      class="ex-ev-pill shrink-0 inline-flex items-center gap-2 h-10 pl-3.5 pr-3 rounded-full bg-ex-text text-white text-[13px] font-semibold shadow-[0_10px_30px_rgba(28,25,23,.28)] cursor-pointer transition-all duration-300 ${show ? "opacity-100 pointer-events-auto" : "opacity-0 translate-y-2"}">

      <span class="h-5 px-1.5 rounded-full bg-white/15 text-[11.5px] font-bold inline-flex items-center ex-num">${o.events.length}</span>

    </button>

}

// Show the pill only while less than ~80px of the Events section is on screen
let exEvObserver = null;
function exWatchEvents() {
  exEvObserver?.disconnect();
  const sec = document.getElementById("exEvents");
  if (!sec || !("IntersectionObserver" in window)) return;
  exEvObserver = new IntersectionObserver(([en]) => {
    const show = !en.isIntersecting && en.boundingClientRect.top > 0; // below the fold, not scrolled past
    if (show === exState.evPill) return;
    exState.evPill = show;
    const pill = document.querySelector("[data-ex-jump-events]");
    if (!pill) return;
    pill.classList.toggle("opacity-100", show); pill.classList.toggle("pointer-events-auto", show);
    pill.classList.toggle("opacity-0", !show); pill.classList.toggle("translate-y-2", !show);
    pill.tabIndex = show ? 0 : -1;
    pill.parentElement.setAttribute("aria-hidden", String(!show));
  }, { rootMargin: "0px 0px -80px 0px" });
  exEvObserver.observe(sec);
}

document.addEventListener("click", (ev) => {
  if (!ev.target.closest("[data-ex-jump-events]")) return;
  const sec = document.getElementById("exEvents");
  sec?.scrollIntoView({ behavior: "smooth", block: "start" });
  sec?.querySelector("#exRowUpcoming button, #exRowDone button")?.focus({ preventScroll: true });
});

// Re-render in place (filters, toggles), keeping the page and sheet scroll positions and the keyboard focus target
function exRefresh(focusSel) {
  const top = app.scrollTop, sheetTop = document.querySelector(".ex-sheet-body")?.scrollTop;
  // The CI card also lives on Live & Upcoming: re-render that page instead of the dashboard
  app.innerHTML = document.querySelector("#app .pv-all") ? renderInsights()
    : document.querySelector("#app .ex-embed") ? renderEvents(activeTab) : renderDashboard();
  app.scrollTop = top;
  const sheet = document.querySelector(".ex-sheet-body");
  if (sheet && sheetTop != null) sheet.scrollTop = sheetTop;

document.addEventListener("click", (ev) => {
  if (!document.querySelector(".exec-dashboard")) return;
  const t = ev.target;
  // a click anywhere outside an open (i) popover closes it
  let closed = false;
  if (exState.info && !t.closest("[data-ex-info-wrap]")) { exState.info = null; closed = true; }
  const b = t.closest("[data-ex-info],[data-ex-event],[data-ex-close],[data-ex-ci],[data-ex-ci-fold],[data-ex-ci-limit],[data-ex-ci-more],[data-ex-add],[data-ex-ci-row],[data-ex-ci-slide],[data-ex-ci-go]");
  if (!b || !b.closest(".exec-dashboard") || b.disabled) { if (closed) exRefresh(); return; }
  const d = b.dataset;
  let focus = null;
  if (d.exInfo) { exState.info = exState.info === d.exInfo ? null : d.exInfo; focus = `[data-ex-info="${d.exInfo}"]`; }
  else if (d.exCiLimit) { exState.ciLimit = Number(d.exCiLimit); exState.ciSlide = 0; focus = `[data-ex-ci-limit="${d.exCiLimit}"]`; }
  else if (d.exCiSlide) { exState.ciSlide += Number(d.exCiSlide); exState.ciAnim = Number(d.exCiSlide); focus = `[data-ex-ci-slide="${d.exCiSlide}"]`; }
  else if (d.exCiGo) { const to = Number(d.exCiGo); exState.ciAnim = to > exState.ciSlide ? 1 : to < exState.ciSlide ? -1 : 0; exState.ciSlide = to; focus = `[data-ex-ci-go="${to}"]`; }
  else if ("exCiMore" in d) { exState.ciLimit += 5; focus = "[data-ex-ci-more]"; }
  else if (d.exAdd) {
    const i = exState.ciAdded.indexOf(d.exAdd);
    if (i < 0) { exState.ciAdded.push(d.exAdd); toast("Added to actionable items"); } else exState.ciAdded.splice(i, 1);
    focus = `[data-ex-add="${d.exAdd}"]`;
  }
  else if (d.exCiRow) { exState.ciRow = exState.ciRow === d.exCiRow ? null : d.exCiRow; focus = `[data-ex-ci-row="${d.exCiRow}"]`; } // NEW CI UI
  else if ("exCiFold" in d) { exState.ciOpen = !exState.ciOpen; focus = "[data-ex-ci-fold]"; }
  else if (d.exEvent) { exState.event = d.exEvent; exState.ciPage = 0; exState.sheetAnim = true; focus = "#exSheetClose"; }
  else if ("exClose" in d) { focus = `[data-ex-event="${exState.event}"]`; exState.event = null; }
  else if (d.exCi) { exState.ciPage += Number(d.exCi); focus = `[data-ex-ci="${d.exCi}"]:not([disabled])`; }
  exRefresh(focus);
});


document.addEventListener("keydown", (ev) => {
  if ((ev.key === "ArrowLeft" || ev.key === "ArrowRight") && ev.target.closest?.(".pv-ci-stage")) {
    const dir = ev.key === "ArrowLeft" ? -1 : 1;
    ev.preventDefault();
    exState.ciSlide += dir; exState.ciAnim = dir;
    exRefresh(`[data-ex-ci-slide="${dir}"]`);
    return;
  }
  if (!document.querySelector(".exec-dashboard") || ev.key !== "Escape") return;
  if (exState.info) { const id = exState.info; exState.info = null; exRefresh(`[data-ex-info="${id}"]`); return; }
  if (exState.event) { const id = exState.event; exState.event = null; exRefresh(`[data-ex-event="${id}"]`); }

/* ================= TEAM TAKEAWAYS (#/takeaways/<id>): every FDC employee's takeaways from one event ================= */

let tk = { dept: "All", q: "" }; // department filter + search on the takeaways screen

const fmtStamp = (d) => new Date(d).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
const fmtDue = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" });

// One row per invited person, with their roster details and status
function teamRows(e) {
  const rank = { submitted: 0, pending: 1, registered: 2, absent: 3 };
  return (EVENT_INSIGHTS[e.id]?.team || []).map((r) => {
    const status = r.registered ? "registered" : r.absent ? "absent" : r.points ? "submitted" : "pending";
    return { ...FDC_TEAM[r.p], ...r, status, points: (r.points || []).map((p) => (typeof p === "string" ? { t: p } : p)) };
  }).sort((a, b) => rank[a.status] - rank[b.status] || new Date(a.at) - new Date(b.at));
}

const TK_STATUS = {
  submitted: (r) => `<span class="tk-st ok">${FI.check} Submitted ${esc(fmtStamp(r.at))}</span>`,
  pending: () => `<span class="tk-st warn">Not submitted yet</span>`,
  absent: () => `<span class="tk-st">Didn't attend</span>`,
  registered: () => `<span class="tk-st">Registered</span>`,
};

function takeawayCard(r) {
  const body = r.status === "submitted"
    ? `<ol class="tk-pts">${r.points.map((p, i) => `
        <li><span class="n">${i + 1}</span><div class="min-w-0"><p>${esc(p.t)}</p>
          ${p.due ? `<span class="tk-act">${FI.check}Action · Owner ${esc(r.name.split(" ")[0])} · Due ${esc(fmtDue(p.due))}</span>` : ""}</div></li>`).join("")}
      </ol>`
    : r.status === "pending"
    ? `<div class="tk-foot"><span>Attended the event, takeaways not in yet.</span><button type="button" class="fo-b sm" data-tk-remind="${esc(r.name)}">Send reminder</button></div>`
    : r.status === "registered"
    ? `<div class="tk-foot"><span>Takeaways will appear here after the event.</span></div>`
    : `<div class="tk-foot"><span>Was invited but didn't attend.</span></div>`;
  return `
  <article class="fo-card tk-card ${r.status === "absent" ? "dim" : ""}">
    <header class="tk-hd">
      ${face(r.img, r.name, "w-11 h-11 text-[14px]")}
      <div class="min-w-0 flex-1">
        <div class="tk-nm">${esc(r.name)} <em class="fo-tag sm">${esc(r.dept)}</em></div>
        <div class="tk-ds">${esc(r.designation)} · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div>
      </div>
      <div class="tk-meta">
        ${TK_STATUS[r.status](r)}
        ${r.status === "submitted" ? `<small>${r.points.length} takeaway${r.points.length === 1 ? "" : "s"}${r.points.some((p) => p.due) ? ` · ${r.points.filter((p) => p.due).length} action${r.points.filter((p) => p.due).length === 1 ? "" : "s"}` : ""}</small>` : ""}
      </div>
    </header>
    ${body}
  </article>`;
}

function renderTakeawaysList() {
  const host = document.getElementById("tkList");
  const e = EVENTS.find((x) => x.id === host?.dataset.event);
  if (!e) return;
  const q = tk.q.trim().toLowerCase();
  const rows = teamRows(e).filter((r) =>
    (tk.dept === "All" || r.dept === tk.dept) &&
    (!q || [r.name, r.designation, r.dept, ...r.points.map((p) => p.t)].some((s) => s.toLowerCase().includes(q))));
  host.innerHTML = rows.length
    ? rows.map(takeawayCard).join("")
    : `<div class="fo-card fo-empty"><b>No matches</b><p>Try another name, department or word.</p></div>`;
}

function renderTakeaways(e) {
  const rows = teamRows(e);
  const upcoming = !isPast(e) && statusOf(e) !== "live";
  const attended = rows.filter((r) => r.status === "submitted" || r.status === "pending");
  const submitted = rows.filter((r) => r.status === "submitted");
  const points = submitted.flatMap((r) => r.points);
  const actions = points.filter((p) => p.due).length;
  const stat = (label, value, sub) => `<div class="tk-stat"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;

  return `
  <div class="fo fo-page">
    ${foTop({
      back: backHref(`#/events?tab=${tabOf(e)}`),
      backLabel: "Back",
      crumbs: `<a href="#/events?tab=${tabOf(e)}">Events</a><i>/</i><a href="#/events/${e.id}">${esc(e.name)}</a><i>/</i><b>Team takeaways</b>`,
      right: `<a href="#/smart-notes/${e.id}" class="fo-tb" aria-label="Smart Notes" title="Smart Notes">${FI.notes}</a>`,
    })}
    <div class="fo-scroll">
      <div class="fo-in wide">
        <div class="fo-hd" style="align-items:center">
          <div class="fo-th" style="flex:none;width:64px;height:64px;border-radius:14px"><img src="${e.image}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 25%" onerror="this.remove()" /></div>
          <div>
            <p style="font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:4px">${esc(e.speaker.name)}</p>
            <h1 class="fo-h1">Team takeaways</h1>
            <p class="fo-sub" style="margin-top:4px">${esc(e.name)}</p>
          </div>

// Same folder as this demo; the space and brackets in the file name are URL-encoded
const SMART_NOTES_SRC = "notes_6%20(1).html";

function renderSmartNotes(e) {
  return `
  <!-- Full screen under the YPO navbar. The notes app is its own standalone page (own styles + hash router),
       so it's framed rather than inlined. Its "Who is in the room" icon (top right of its toolbar) messages us back. -->
  <iframe id="smartNotesFrame" src="${SMART_NOTES_SRC}?event=${encodeURIComponent(e.id)}&amp;title=${encodeURIComponent(e.name)}" title="Smart Notes for ${esc(e.name)}"
    allow="clipboard-read; clipboard-write; fullscreen; autoplay; microphone; camera"
    class="block flex-1 w-full min-h-0 border-0 bg-white"></iframe>`;
}

// Buttons inside Smart Notes post these messages:
//   person icon (toolbar, top right) → Who is in the room for the event being noted
//   back arrow (next to the Folio heading) → the dashboard, on the tab the event belongs to
window.addEventListener("message", (ev) => {
  const frame = document.getElementById("smartNotesFrame");
  if (!frame || ev.source !== frame.contentWindow) return;
  const [, page, id] = location.hash.split("?")[0].split("/");
  const event = page === "smart-notes" && id && EVENTS.find((e) => e.id === id);
  if (!event) return;
  if (ev.data?.type === "smartnotes:open-room") location.hash = `#/room/${id}`;
  if (ev.data?.type === "smartnotes:back") location.hash = backHref(`#/events?tab=${tabOf(event)}`);
  // Toolbar back arrow (left of the sidebar toggle): always the events list on the Live & Upcoming tab
  if (ev.data?.type === "smartnotes:events") location.hash = "#/events?tab=current";
});

    // Pill goes away while its block is on the form (inline style, since the pill's inline-flex beats Tailwind's .hidden)
    add.style.display = "none";
    document.querySelector(`[data-companion="${key}"] input`)?.focus();
    return;
  }
  const remove = ev.target.closest("[data-remove-companion]");
  if (remove) {
    const block = remove.closest("[data-companion]");
    const pill = document.querySelector(`[data-add-companion="${block.dataset.companion}"]`);
    if (pill) pill.style.display = "";
    block.remove();
    return;
  }
  const addRow = ev.target.closest("[data-add-row]");
  if (addRow) {
    const block = addRow.closest("[data-companion]");
    block.querySelector("[data-rows]").insertAdjacentHTML("beforeend", companionRow(block.dataset.companion, true));
    block.querySelector("[data-companion-row]:last-child input")?.focus();
    return;
  }
  const removeRow = ev.target.closest("[data-remove-row]");

});

// Basic checks, then mark the event as registered so its card unlocks
function submitRegister(form) {
  const e = EVENTS.find((x) => x.id === form.dataset.event);
  const v = Object.fromEntries(new FormData(form).entries());
  const errors = {
    name: !v.name.trim() ? "Please enter your name." : "",
    membership: !/^[A-Za-z0-9-]{4,20}$/.test(v.membership.trim()) ? "Please enter a valid membership number." : "",
    phone: !/^\+?[\d\s-]{10,15}$/.test(v.phone.trim()) ? "Please enter a valid phone number." : "",
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim()) ? "Please enter a valid email ID." : "",
  };
  // Added spouse / children / guests need at least a name; phone is optional but must look valid
  form.querySelectorAll("#companionBlocks input").forEach((input) => {
    const val = input.value.trim();
    errors[input.name] =
      input.hasAttribute("data-req") && !val ? "Please enter a name."
      : input.type === "tel" && val && !/^\+?[\d\s-]{10,15}$/.test(val) ? "Please enter a valid phone number."
      : input.type === "number" && val && !(+val >= 0 && +val <= 25) ? "Please enter a valid age."
      : "";
  });
  let ok = true;
  for (const [k, msg] of Object.entries(errors)) {
    const input = form.elements[k];
    const hint = form.querySelector(`[data-error="${k}"]`);
    hint.textContent = msg;
    hint.classList.toggle("hidden", !msg);
    input.classList.toggle("border-[#DC2626]", !!msg);
    if (msg && ok) { input.focus(); ok = false; }
  }
  if (!ok) return;
  e.registered = true;
  app.innerHTML = renderRegister(e, true);
  renderNav();
}

});

function empValidate() {
  const e = ob.emp;
  const errs = {};
  if (!e.first.trim()) errs["emp.first"] = "Please enter a first name";

  if (!e.email.trim()) errs["emp.email"] = "Please enter an e-mail";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.email.trim())) errs["emp.email"] = "Please enter a valid e-mail";
  if (e.mobile.trim() && !/^\+?[\d\s-]{8,15}$/.test(e.mobile.trim())) errs["emp.mobile"] = "Please enter a valid mobile number";
  if (!e.category) errs["emp.category"] = "Please pick a category";
  ob.errors = errs;
  return !Object.keys(errs).length;
}

function saveEmployee(another) {

// Small CSV reader: header row picks the columns, quoted values may contain commas
function importTeamCsv(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim())
    .map((l) => (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).map((c) => c.replace(/,$/, "").replace(/^"|"$/g, "").replace(/""/g, '"').trim()));
  if (rows.length < 2) return toast("That CSV has no rows to import");
  const head = rows[0].map((h) => h.toLowerCase());
  const col = (...keys) => head.findIndex((h) => keys.some((k) => h.includes(k)));
  const idx = {
    first: col("first"), last: col("last"), name: col("name"),
    mobile: col("mobile", "phone"), email: col("mail"), designation: col("designation", "title", "role"),
    dob: col("birth", "dob"), category: col("category", "department"),
  };
  let added = 0;
  rows.slice(1).forEach((r) => {
    const get = (k) => (idx[k] >= 0 ? r[idx[k]] || "" : "");
    let first = get("first"), last = get("last");
    if (!first && !last && get("name")) {
      const parts = get("name").split(/\s+/);
      first = parts.shift();
      last = parts.join(" ");
    }
    if (!first && !get("email")) return;
    const cat = CATEGORIES.find((c) => c.toLowerCase() === get("category").toLowerCase()) || get("category");
    ob.team.push({ first, last, mobile: get("mobile"), email: get("email"), designation: get("designation"), dob: get("dob"), category: cat });
    added++;
  });
  obRerender();
  toast(added ? `${added} ${added === 1 ? "person" : "people"} imported` : "No people found in that CSV");
}

function obCompleteness() {
  const c = ob.company, p = ob.partner;

    Object.values(p.product.checked).some(Boolean) || Object.values(p.services.checked).some(Boolean), ob.team.length];
  return Math.round((checks.filter((v) => (typeof v === "string" ? v.trim() : v)).length / checks.length) * 100);
}

  const path = ev.target.dataset && ev.target.dataset.ob;
  if (!path) return;
  obSet(path, ev.target.value);
  if (ob.errors[path]) {
    delete ob.errors[path];
    ev.target.classList.remove("border-[#DC2626]");
    ev.target.classList.add("border-[#ECE4DC]");
    ev.target.closest("label")?.querySelector("[data-err]")?.remove();
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.matches("[data-ob-logo]") && t.files[0]) {
    if (ob.company.logo) URL.revokeObjectURL(ob.company.logo);
    ob.company.logo = URL.createObjectURL(t.files[0]);
    ob.company.logoName = t.files[0].name;
    return obRerender();
  }
  if (t.matches("[data-ob-partner]")) {
    const side = ob.partner[ob.partner.tab];
    side.checked[t.dataset.obPartner] = t.checked;
    obRerender();
    // Put the cursor in the follow-up field that just appeared
    const extra = PARTNER_TYPES.find((x) => x.key === t.dataset.obPartner).extra;
    if (t.checked && extra) app.querySelector(`[data-ob="partner.${ob.partner.tab}.${extra.field}"]`)?.focus();
  }
});

document.addEventListener("click", (ev) => {
  const nature = ev.target.closest("[data-ob-nature]");
  if (nature) {
    const n = nature.dataset.obNature;
    const list = ob.company.nature;
    list.includes(n) ? list.splice(list.indexOf(n), 1) : list.push(n);
    return obRerender();
  }
  const tab = ev.target.closest("[data-ob-tab]");
  if (tab) { ob.partner.tab = tab.dataset.obTab; return obRerender(); }
  const go = ev.target.closest("[data-ob-go]");
  if (go) return obGo(Number(go.dataset.obGo));
});

document.addEventListener("submit", (ev) => {
  if (ev.target.id === "obForm") { ev.preventDefault(); obSubmit(); }
});

/* ================= MANAGE COMPANY (admin, from the hamburger menu): company profile + Team Directory ================= */

let companyTab = 0; // 0-2 company profile, 3 Team Directory
const COMPANY_INTRO = [
  "The basics members see about your company.",
  "Who your company can reach, so we can match you with the right members.",
  "The partners and collaborations you're looking to build through Smart Networks.",
  "Everyone from your company who may attend events. Add, import or remove people.",
];

function renderCompany() {
  const t = companyTab;
  const c = ob.company;
  const tabs = ["Company Information", "Questions", "Partnerships & Collaboration", "Team Directory"];
  const adding = t === 3 && ob.teamView === "add";
  const body = [obStepCompany, obStepQuestions, obStepPartners, obStepTeam][t]();

  const navItem = (i) => `
    <button type="button" data-company-tab="${i}" aria-selected="${i === t}" class="fo-step ${i === t ? "on" : ""}" style="align-items:center">
      <span style="display:grid;color:${i === t ? "var(--fg)" : "var(--muted2)"}">${[FI.building, FI.chat, FI.handshake, FI.people][i]}</span>
      <span style="min-width:0"><b>${tabs[i]}</b></span>
      ${i === 3 ? `<span class="c">${ob.team.length}</span>` : ""}
    </button>`;

  return `
  <div class="fo fo-split">
    <aside class="fo-side">
      <div class="fo-co">
        <span class="fo-logo">${c.logo ? `<img src="${c.logo}" alt="" />` : esc(initials(c.name || "Company"))}</span>
        <div style="min-width:0">
          <div style="font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name || "Your company")}</div>
          <div style="font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.url || "")}</div>
        </div>
      </div>
      ${c.nature.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0">${c.nature.map((n) => `<em class="fo-tag sm">${esc(n)}</em>`).join("")}</div>` : ""}
      <div class="fo-lbl">Company profile</div>
      ${[0, 1, 2].map(navItem).join("")}
      <div class="fo-lbl">Your team</div>
      ${navItem(3)}
    </aside>

    <div class="fo-scroll">
      <div class="fo-in">
        <!-- Phones/tablets: company + section picker instead of the sidebar -->
        <div class="lg:hidden" style="margin-bottom:22px">
          <div class="fo-co" style="padding:0">
            <span class="fo-logo">${c.logo ? `<img src="${c.logo}" alt="" />` : esc(initials(c.name || "Company"))}</span>
            <div style="min-width:0">
              <div style="font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name || "Your company")}</div>
              <div style="font-size:12px;color:var(--muted2)">${ob.team.length} ${ob.team.length === 1 ? "person" : "people"} in team</div>
            </div>
          </div>
          <div class="fo-seg" style="margin-top:14px;max-width:100%;overflow-x:auto">
            ${tabs.map((label, i) => `<button type="button" data-company-tab="${i}" class="${i === t ? "on" : ""}" style="white-space:nowrap">${["Company", "Questions", "Partnerships", "Team"][i]}</button>`).join("")}
          </div>
        </div>

        ${adding ? renderAddEmployee() : `
        <div class="fo-hd" style="flex-wrap:wrap">
          <div style="min-width:220px">
            <p style="font-size:12px;font-weight:600;color:var(--muted2);margin-bottom:6px">Manage Company</p>
            <h1 class="fo-h1">${tabs[t]}</h1>
            <p class="fo-sub">${COMPANY_INTRO[t]}</p>
          </div>
          ${t === 3 ? teamActions() : ""}
        </div>
        <div class="fo-hr"></div>

        <form id="companyForm" novalidate class="fo-form">
          ${body}
          ${t < 3 ? `
          <div class="fo-foot" style="justify-content:flex-end">
            <button type="submit" class="fo-b pri">${FI.check} Save changes</button>
          </div>` : ""}
        </form>`}
      </div>
    </div>
  </div>`;
}

document.addEventListener("click", (ev) => {
  // Onboarding Form (drawer): always starts again from step 1
  if (ev.target.closest("[data-ob-start]")) {
    ob.step = 0;
    ob.teamView = "list";
    ob.errors = {};
    if (location.hash === "#/onboarding") route();
    return;
  }
  const tab = ev.target.closest("[data-company-tab]");
  if (!tab) return;
  companyTab = Number(tab.dataset.companyTab);
  ob.teamView = "list";
  ob.errors = {};
  obRerender();
});

document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "companyForm") return;
  ev.preventDefault();
  obRerender(); // refreshes the header (name, website, nature)
  toast("Changes saved");
});

/* ================= ROUTER ================= */

// Where the user has been inside this page, so every back button returns to the screen they came from.
// Our own stack, not history.back(): the Smart Notes iframe changes its own hash, which also lands in the
// browser's history, so history.back() could step around inside Smart Notes instead of leaving it.
const navStack = [];
function trackNav() {
  const h = location.hash || "#/events";
  if (navStack.length > 1 && navStack[navStack.length - 2] === h) navStack.pop(); // went back (our button or the browser's)
  else if (navStack[navStack.length - 1] !== h) navStack.push(h);
}
// The previous screen, or `fallback` when the page was opened straight onto this one
const backHref = (fallback) => (navStack.length > 1 ? navStack[navStack.length - 2] : fallback);

const app = document.getElementById("app");

let activeTab = DEFAULT_TAB; // which of Live & Upcoming / Past is highlighted in the sidebar
let currentPage = "events"; // events pages vs onboarding / Manage Company, for the drawer highlight

function route() {
  const [path, query = ""] = (location.hash || "#/events").split("?");
  const [, page, id] = path.split("/");
  closePerson();
  closeEventSheet();
  renderMeMenu(false);
  const event = id && EVENTS.find((e) => e.id === id);

  // First time an admin comes in, the company onboarding comes before anything else
  if (isAdmin() && !onboarded && page !== "onboarding") return location.replace("#/onboarding");
  trackNav();

  currentPage = page || "events";
  let landing = false; // events page (Live & Upcoming / Past): gets the tinted canvas
  // The Dashboard has been taken out: old #/dashboard links land on Events > Live & Upcoming
  if (page === "dashboard") return location.replace("#/events");
  if (page === "insights") {
    // Top 10 Collective intelligence, from the slider's "View more"
    landing = true;
    activeTab = DEFAULT_TAB;
    exState.event = null;
    app.innerHTML = renderInsights();
  } else if (page === "collabs") {
    // Every Collaboration card, from the panel's "View all"
    landing = true;
    activeTab = DEFAULT_TAB;
    exState.event = null;
    app.innerHTML = renderCollabAll();
  } else if (page === "onboarding") {
    if (!isAdmin()) return location.replace("#/events");
    app.innerHTML = renderOnboarding();
  } else if (page === "company") {
    if (!isAdmin()) return location.replace("#/events");
    ob.teamView = "list";
    ob.errors = {};
    app.innerHTML = renderCompany();
  } else if (page === "register" && event) {
    activeTab = tabOf(event);
    app.innerHTML = renderRegister(event);
  } else if (page === "takeaways" && event) {
    activeTab = tabOf(event);
    tk = { dept: "All", q: "" };
    app.innerHTML = renderTakeaways(event);
    renderTakeawaysList();
  } else if (page === "smart-notes" && event) {
    activeTab = tabOf(event);
    app.innerHTML = renderSmartNotes(event);
    // From the dashboard's Takeaways card: once Smart Notes has loaded, ask it to open its takeaways
    if (new URLSearchParams(query).get("view") === "takeaways") {
      const frame = document.getElementById("smartNotesFrame");
      frame.addEventListener("load", () => setTimeout(() => frame.contentWindow.postMessage({ type: "smartnotes:open-takeaways" }, "*"), 400), { once: true });
    }
  } else if (page === "room" && event) {
    activeTab = tabOf(event);
    search = "";
    app.innerHTML = renderRoom(event);
    renderRoomList();
  } else if (page === "events" && event) {
    // Same one page as the room (details on top, attendees below); back goes to the dashboard
    activeTab = tabOf(event);
    search = "";
    app.innerHTML = renderDetails(event);
    renderRoomList();
  } else {
    // Live & Upcoming is the default page
    landing = true;
    const tab = new URLSearchParams(query).get("tab");
    activeTab = EVENT_TABS.includes(tab) ? tab : DEFAULT_TAB;
    exState.event = null; // no dashboard event sheet here
    exState.animate = true; // CI card rises in once per visit
    app.innerHTML = renderEvents(activeTab);
    exState.animate = false;
    requestAnimationFrame(pvWatchBelow);
  }
  renderNav();
  document.getElementById("shell").classList.toggle("ev-canvas", landing);
  // No hamburger bar on the event details and register pages
  document.getElementById("subBar").classList.toggle("hidden", !!event && ["events", "register", "smart-notes", "room", "takeaways"].includes(page));
  // Smart Notes, Who is in the room and event details go edge to edge (one product, Folio look): only the YPO navbar stays above
  // Onboarding and Manage Company too: their sidebar runs edge to edge under the hamburger bar, like Folio's admin console
  const fullBleed = (!!event && ["smart-notes", "room", "events", "register", "takeaways"].includes(page)) || page === "onboarding" || page === "company";
  // The Command Centre also runs edge to edge (its own canvas colour), but keeps the page scroll
  const edge = fullBleed || page === "dashboard";
  ["mx-4", "md:mx-[50px]"].forEach((c) => app.classList.toggle(c, !edge));
  app.classList.toggle("overflow-y-auto", !fullBleed);
  app.classList.toggle("overflow-hidden", fullBleed);
  // "Dashboard" label only on the main screen
  document.getElementById("crumb").classList.toggle("hidden", !!event);
  if (page === "onboarding") document.getElementById("crumb").textContent = "Company onboarding";
  if (page === "company") document.getElementById("crumb").textContent = "Manage Company";
  if (page === "insights") document.getElementById("crumb").textContent = "Collective Intelligence / Top 10";
  if (page === "collabs") document.getElementById("crumb").textContent = "Collective Intelligence / Collaboration";
  if (page === "dashboard") document.getElementById("crumb").textContent = "Dashboard";
  app.scrollTop = 0;
  if (page === "dashboard") exAfterRender();
  else exSyncNav(); // clears the navbar sector picker off non-dashboard pages
}

/* ================= DRAWER NAV: Events > Live & Upcoming / Past ================= */

let eventsMenuOpen = true;

function navHTML() {
  const sub = EVENT_TABS.map((t) => {
    const active = t === activeTab && currentPage === "events";
    return `
      <a href="#/events?tab=${t}" data-close-drawer aria-current="${active ? "page" : "false"}" class="fo-nav-row ${active ? "on" : ""}">
        ${t === "past" ? FI.history : FI.date}
        <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${TABS[t].label}</span>
        <span class="c">${eventsFor(t).length}</span>
      </a>`;
  }).join("");

  return `
    <div class="fo-lbl" style="padding-top:4px">My Network</div>
    <button type="button" data-toggle-events aria-expanded="${eventsMenuOpen}" class="fo-nav-row" style="color:var(--fg);font-weight:550">
      ${FI.grid}
      <span style="flex:1">${isAdmin() ? "Events & Collabs" : "Events"}</span>
      <span style="display:grid;color:var(--muted2);transition:transform .25s;${eventsMenuOpen ? "transform:rotate(180deg)" : ""}">${FI.chevron}</span>
    </button>
    ${eventsMenuOpen ? `
    <div style="margin:2px 0 4px 17px;padding-left:6px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:1px">${sub}</div>` : ""}
    ${isAdmin() ? `
    <div class="fo-lbl">Admin</div>
    <!-- Admin: the full first-login onboarding flow, opened from step 1 (for demoing it on its own) -->
    <a href="#/onboarding" data-ob-start data-close-drawer aria-current="${currentPage === "onboarding" ? "page" : "false"}" class="fo-nav-row ${currentPage === "onboarding" ? "on" : ""}">
      ${FI.clipboard}<span style="flex:1">Onboarding Form</span>
    </a>
    <!-- Admin: company profile + team (user management) -->
    <a href="#/company" data-close-drawer aria-current="${currentPage === "company" ? "page" : "false"}" class="fo-nav-row ${currentPage === "company" ? "on" : ""}">
      ${FI.building}<span style="flex:1">Manage Company</span>
    </a>` : ""}`;
}

function renderNav() {
  document.getElementById("drawerNav").innerHTML = navHTML();
  // Main page: the Collective Intelligence card on top, Practices + Collaboration below. The sub-bar names the page,
  // so the card itself carries no title here.
  const home = "Collective Intelligence";
  document.getElementById("crumb").textContent = activeTab === DEFAULT_TAB ? home : `${home} / ${TABS[activeTab].heading}`;
}

/* Drawer open / close (slides in from the left, backdrop fades) */
const drawer = document.getElementById("drawer");
const drawerPanel = document.getElementById("drawerPanel");
function setDrawer(open) {
  drawer.classList.toggle("opacity-0", !open);
  drawer.classList.toggle("pointer-events-none", !open);
  drawerPanel.classList.toggle("-translate-x-full", !open);
  drawer.setAttribute("aria-hidden", String(!open));
}

window.addEventListener("hashchange", route);

// Live & Upcoming rows: arrow buttons scroll one card's width
document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-strip]");
  if (!btn) return;
  const row = document.getElementById(`strip-${btn.dataset.strip}`);
  const card = row && row.querySelector(".fo-ev");
  if (card) row.scrollBy({ left: Number(btn.dataset.dir) * (card.offsetWidth + 16), behavior: "smooth" });
});

document.addEventListener("input", (ev) => {
  if (ev.target.id === "roomSearch") { search = ev.target.value; renderRoomList(); }
  if (ev.target.id === "tkSearch") { tk.q = ev.target.value; renderTakeawaysList(); }
});

// Admin: registrations on/off for an event
document.addEventListener("change", (ev) => {
  const id = ev.target.dataset && ev.target.dataset.regToggle;
  if (!id) return;
  const e = EVENTS.find((x) => x.id === id);
  e.registrationOpen = ev.target.checked;
  route();
  toast(`Registrations ${e.registrationOpen ? "opened" : "closed"}`);
});

document.addEventListener("click", (ev) => {
  // Account menu: open/close, Switch Role list, pick a role
  if (ev.target.closest("#meBtn")) return renderMeMenu(document.getElementById("meMenu").classList.contains("hidden"));
  if (ev.target.closest("[data-roles-toggle]")) { rolesOpen = !rolesOpen; return renderMeMenu(true); }
  const pick = ev.target.closest("[data-switch-role]");
  if (pick) {
    // Member view isn't ready yet: show the coming soon toast and stay on the current role
    if (pick.dataset.switchRole === "member" && role !== "member") {
      rolesOpen = false;
      renderMeMenu(false);
      return toast("Member view is coming soon");
    }
    if (pick.dataset.switchRole !== role) return switchRole(pick.dataset.switchRole);
    rolesOpen = false;
    return renderMeMenu(true);
  }
  if (!ev.target.closest("#me")) renderMeMenu(false);

  // "Role switched" OK (or clicking outside it): go to the home page for the new role
  const ok = ev.target.closest("[data-role-ok]");
  if (ok && (ev.target === ok || ok.tagName === "BUTTON")) {
    document.getElementById("modalRoot").innerHTML = "";
    const home = "#/events";
    if (location.hash === home) return route();
    return (location.hash = home);
  }

  // Admin event menu (three dots)
  const evMenu = ev.target.closest("[data-event-menu]");
  document.querySelectorAll("[data-event-menu-list]").forEach((m) => {
    if (!evMenu || m.previousElementSibling !== evMenu) m.classList.add("hidden");
  });
  if (evMenu) return evMenu.nextElementSibling.classList.toggle("hidden");

  const demo = ev.target.closest("[data-demo]");
  if (demo) {
    renderMeMenu(false);
    return toast(`${demo.dataset.demo} isn't part of this demo`);
  }
  const soon = ev.target.closest("[data-soon]");
  if (soon) {
    renderMeMenu(false);
    return toast(`${soon.dataset.soon} coming soon`);
  }

  // Team takeaways screen: department filter + reminders
  const tkDept = ev.target.closest("[data-tk-dept]");
  if (tkDept) {
    tk.dept = tkDept.dataset.tkDept;
    document.querySelectorAll("[data-tk-dept]").forEach((b) => { const on = b === tkDept; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    return renderTakeawaysList();
  }
  const remind = ev.target.closest("[data-tk-remind]");
  if (remind) return toast(`Reminder sent to ${remind.dataset.tkRemind}`);

  // "More details" on an event card opens the side sheet instead of the card's own link
  const more = ev.target.closest("[data-ev-more]");
  if (more) return openEventSheet(more.dataset.evMore, more);
  if (ev.target.closest("[data-ev-close]")) return closeEventSheet();
  const evCi = ev.target.closest("[data-ev-ci]");
  if (evCi && !evCi.disabled) return pageEventSheet(Number(evCi.dataset.evCi));

  // Event card: clicking anywhere opens the event (or the register form if not registered yet)
  const card = ev.target.closest("[data-href]");
  if (card && !ev.target.closest("a")) return (location.hash = card.dataset.href);

  // "Find value" is inside the attendee row, so handle it before the row's own click
  const value = ev.target.closest("[data-value]");
  if (value) return openValue(Number(value.dataset.value));

  const person = ev.target.closest("[data-person]");
  if (person) return openPerson(Number(person.dataset.person));

  if (ev.target.closest("[data-toggle-events]")) {
    eventsMenuOpen = !eventsMenuOpen;
    return renderNav();
  }

  const allBtn = ev.target.closest("[data-ev-all]");
  if (allBtn) return openAllUpcoming(allBtn);
  const closeModal = ev.target.closest("[data-close-modal]");
  if (closeModal && (ev.target === closeModal || closeModal.tagName === "BUTTON")) {
    const back = document.querySelector(".pv-all") ? allUpcomingFrom : null;
    closePerson();
    back?.focus();
  }

  if (ev.target.closest("#openDrawer")) setDrawer(true);
  if (ev.target.closest("[data-close-drawer]")) setDrawer(false);
});

document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (profPop.id) return closeProfile();
  if (teamPop.id) return teamPop.person ? openTeamPop(teamPop.id, null) : closeTeamPop();
  if (evSheet.id) return closeEventSheet();
  // Closing "Role switched" still lands on the new role's home
  if (document.querySelector("button[data-role-ok]")) return document.querySelector("button[data-role-ok]").click();
  renderMeMenu(false);
  closePerson();
  setDrawer(false);
});

renderMeMenu(false);
route();
</script>
</body>
